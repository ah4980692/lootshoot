<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="LootShoot — Your listing has been submitted for review."
  />

  <title>LootShoot — Listing Submitted</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: #111827;
      font-family: "DM Sans", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .submitted-card {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .hourglass-badge {
      width: 96px;
      height: 96px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: linear-gradient(145deg, #eafaf1, #dff3eb);
      display: grid;
      place-items: center;
      box-shadow: 0 12px 30px rgba(21, 150, 90, 0.15);
    }

    .hourglass-badge svg {
      width: 42px;
      height: 42px;
      transform-origin: center;
      animation: flip 2.4s ease-in-out infinite;
    }

    @keyframes flip {
      0%, 15% {
        transform: rotate(0deg);
      }
      50%, 65% {
        transform: rotate(180deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    h1 {
      margin: 0 0 14px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 24px;
      letter-spacing: -0.02em;
      color: #111827;
    }

    p {
      margin: 0 0 30px;
      color: #6d777f;
      font-size: 14px;
      line-height: 1.7;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 24px;
      border: none;
      border-radius: 30px;
      background: #15965a;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 22px rgba(21, 150, 90, 0.22);
      transition: 0.2s ease;
    }

    .back-button:hover {
      background: #107e4b;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

  <div class="submitted-card">

    <div class="hourglass-badge">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="#15965a"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M5 22h14" />
        <path d="M5 2h14" />
        <path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22" />
        <path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2" />
      </svg>
    </div>

    <h1>Listing submitted</h1>

    <p>
      Your listing has been submitted for review. Once approved, it
      will go live on LootShoot.
    </p>

    <a class="back-button" href="seller-dashboard.html?tab=my-ads">
      Back to My Ads →
    </a>

  </div>

</body>
</html>
