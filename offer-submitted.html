<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LootShoot — Explore</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================
       RESET
    ========================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "DM Sans", sans-serif;
      color: #092f36;
      background: #f5fcf9;
    }

    button,
    input {
      font-family: inherit;
    }


    /* =========================================
       HEADER
    ========================================= */

    .top-header {
      height: 72px;
      background: #ffffff;
      border-bottom: 1px solid #e2eee9;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 5%;

      position: relative;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;

      color: #092f36;

      font-family: "Space Grotesk", sans-serif;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.7px;
    }

    .logo-icon {
      width: 31px;
      height: 31px;

      border: 3px solid #15965a;
      border-radius: 50%;

      position: relative;
    }

    .logo-icon::before,
    .logo-icon::after {
      content: "";

      position: absolute;
      background: #15965a;
    }

    .logo-icon::before {
      width: 3px;
      height: 37px;

      left: 11px;
      top: -6px;
    }

    .logo-icon::after {
      width: 37px;
      height: 3px;

      left: -6px;
      top: 11px;
    }

    .header-menu {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .header-menu a {
      text-decoration: none;
      color: #294d52;
      font-size: 13px;
      font-weight: 600;
    }

    .header-menu a:hover {
      color: #15965a;
    }

    .menu-button {
      display: none;

      width: 42px;
      height: 42px;

      border: 0;
      background: transparent;

      font-size: 25px;
      cursor: pointer;
    }


    /* =========================================
       EXPLORE PAGE
    ========================================= */

    .explore-page {
      min-height: calc(100vh - 72px);
      padding: 30px 20px 70px;

      background:
        linear-gradient(
          135deg,
          #ffffff 0%,
          #effbf6 100%
        );
    }


    /* =========================================
       HERO
    ========================================= */

    .explore-hero {

      max-width: 1200px;
      min-height: 270px;

      margin: 0 auto;

      position: relative;
      overflow: hidden;

      border: 1px solid #dcefe7;
      border-radius: 25px;

      background:
        linear-gradient(
          110deg,
          #edf9f4 0%,
          #ffffff 100%
        );
    }

    .hero-content {
      position: relative;
      z-index: 3;

      max-width: 650px;

      padding: 40px;
    }

    .hero-label {
      display: block;

      margin-bottom: 8px;

      color: #15965a;

      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.3px;
    }

    .hero-content h1 {

      color: #062b32;

      font-family: "Space Grotesk", sans-serif;

      font-size: clamp(45px, 7vw, 70px);
      line-height: 1;

      letter-spacing: -2px;
    }

    .hero-content p {

      max-width: 500px;

      margin: 14px 0 23px;

      color: #55767b;

      font-size: 15px;
      line-height: 1.6;
    }


    /* =========================================
       HERO DECORATION
    ========================================= */

    .hero-decoration {

      position: absolute;

      right: -50px;
      top: -80px;

      width: 530px;
      height: 400px;

      background: #91e4c2;

      opacity: .42;

      border-radius: 48% 52% 55% 45%;

      transform: rotate(-12deg);

      z-index: 1;
    }


    /* =========================================
       FOJI.PNG CHARACTER
    ========================================= */

    .hero-character {

      position: absolute;

      right: 0;
      top: 0;

      width: 420px;
      height: 100%;

      z-index: 2;

      pointer-events: none;
    }

    .hero-character img {

      width: 100%;
      height: 100%;

      object-fit: contain;
      object-position: center bottom;

      display: block;

      opacity: .78;
    }


    /* =========================================
       SEARCH
    ========================================= */

    .search-row {

      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box {

      width: 100%;
      max-width: 500px;
      height: 48px;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 0 17px;

      background: #ffffff;

      border: 1px solid #d5eae1;

      border-radius: 25px;

      box-shadow:
        0 6px 20px rgba(20, 100, 70, .07);
    }

    .search-icon {

      color: #15965a;

      font-size: 27px;
      line-height: 1;
    }

    .search-box input {

      width: 100%;

      border: 0;
      outline: 0;

      background: transparent;

      color: #153b41;

      font-size: 14px;
    }

    .search-box input::placeholder {
      color: #86a1a5;
    }


    /* =========================================
       FILTER BUTTON
    ========================================= */

    .filter-button {

      height: 48px;

      padding: 0 20px;

      border: 1px solid #cfe7dc;

      border-radius: 25px;

      background: #ffffff;

      color: #163a40;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;
    }

    .filter-button span {
      color: #15965a;
      margin-right: 5px;
    }

    .filter-button:hover {
      border-color: #15965a;
    }


    /* =========================================
       CATEGORIES
    ========================================= */

    .categories {

      max-width: 1200px;

      margin: 24px auto 20px;

      display: flex;
      gap: 10px;

      overflow-x: auto;

      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {

      flex: 0 0 auto;

      padding: 12px 25px;

      border: 1px solid #d5ebe2;

      border-radius: 25px;

      background: #ffffff;

      color: #12363d;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition: .2s ease;
    }

    .category:hover {
      border-color: #15965a;
    }

    .category.active {

      background: #15965a;

      border-color: #15965a;

      color: #ffffff;
    }


    /* =========================================
       LISTINGS GRID
    ========================================= */

    .listings {

      max-width: 1200px;

      margin: 0 auto;

      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 18px;
    }


    /* =========================================
       CARD
    ========================================= */

    .card {

      overflow: hidden;

      background: #ffffff;

      border: 1px solid #dceee7;

      border-radius: 17px;

      box-shadow:
        0 7px 25px rgba(16, 90, 65, .08);

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .card:hover {

      transform: translateY(-4px);

      box-shadow:
        0 12px 30px rgba(16, 90, 65, .13);
    }


    /* =========================================
       CARD IMAGE
    ========================================= */

    .card-image {

      height: 155px;

      position: relative;
      overflow: hidden;

      background: #dff2e9;
    }

    .card-image img {

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }


    /* =========================================
       BADGES
    ========================================= */

    .badge {

      position: absolute;

      left: 10px;
      top: 10px;

      padding: 6px 12px;

      border-radius: 20px;

      background: #6ff0bb;

      color: #06352a;

      font-size: 11px;
      font-weight: 800;
    }

    .badge-pop {
      background: #71e9ba;
    }

    .badge-other {
      background: #8ce8c3;
    }


    /* =========================================
       FAVORITE
    ========================================= */

    .favorite {

      position: absolute;

      right: 10px;
      top: 10px;

      width: 33px;
      height: 33px;

      border: 0;

      border-radius: 50%;

      background: #ffffff;

      color: #15965a;

      font-size: 21px;

      cursor: pointer;

      box-shadow:
        0 3px 10px rgba(0,0,0,.10);
    }

    .favorite.liked {
      color: #e74d72;
    }


    /* =========================================
       CARD CONTENT
    ========================================= */

    .card-content {
      padding: 15px;
    }

    .card-title {

      margin-bottom: 5px;

      color: #092f36;

      font-family: "Space Grotesk", sans-serif;

      font-size: 16px;
      line-height: 1.3;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-info {

      margin: 0;

      color: #7a979b;

      font-size: 12px;

      line-height: 1.5;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .price {

      margin: 10px 0;

      color: #15965a;

      font-size: 20px;

      font-weight: 800;
    }


    /* =========================================
       SELLER
    ========================================= */

    .seller {

      display: flex;
      align-items: center;

      gap: 8px;

      color: #25474d;

      font-size: 12px;
      font-weight: 700;
    }

    .seller-avatar {

      width: 27px;
      height: 27px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #d9f4e8;

      color: #15965a;

      font-weight: 800;

      overflow: hidden;

      flex-shrink: 0;
    }

    .seller-avatar img {

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }


    /* =========================================
       DETAILS BUTTON
    ========================================= */

    .details {

      width: 100%;
      height: 39px;

      margin-top: 13px;

      border: 1px solid #64d4aa;

      border-radius: 20px;

      background: #ffffff;

      color: #15965a;

      font-size: 13px;
      font-weight: 800;

      cursor: pointer;

      transition: .2s ease;
    }

    .details:hover {

      background: #15965a;

      color: #ffffff;
    }

    .details span {
      margin-left: 6px;
    }


    /* =========================================
       POP CARD
    ========================================= */

    .pop-image {

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 30% 40%,
          #58dfaa,
          #08784e
        );
    }

    .pop-content {

      display: flex;
      align-items: center;

      gap: 7px;

      color: #ffffff;
    }

    .pop-heart {

      color: #ff6683;

      font-size: 39px;
    }

    .pop-number {

      font-size: 29px;

      font-weight: 800;

      line-height: 1;
    }

    .pop-text {

      font-size: 14px;

      font-weight: 800;
    }


    /* =========================================
       UC CARD
    ========================================= */

    .uc-image {

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #183b3a,
          #82bd9e
        );
    }

    .uc-box {

      padding: 18px 38px;

      border-radius: 12px;

      background: #e5d09c;

      color: #5d481e;

      text-align: center;

      transform: rotate(-5deg);

      box-shadow:
        0 8px 15px rgba(0,0,0,.20);
    }

    .uc-box strong {

      display: block;

      font-size: 43px;

      line-height: 1;
    }

    .uc-box span {

      font-size: 14px;

      font-weight: 800;
    }


    /* =========================================
       MYTHIC ACCOUNT
    ========================================= */

    .mythic-image {

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #273b75,
          #a54ed0
        );
    }

    .mythic-icon {
      font-size: 80px;
    }


    /* =========================================
       ROYAL PASS
    ========================================= */

    .royal-image {

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #102d37,
          #27696a
        );
    }

    .royal-content {

      text-align: center;

      color: #f0d477;
    }

    .royal-content strong {

      display: block;

      font-size: 55px;

      line-height: 1;
    }

    .royal-content span {

      font-size: 11px;

      font-weight: 800;
    }


    /* =========================================
       NO RESULTS
    ========================================= */

    .no-results {

      display: none;

      max-width: 500px;

      margin: 50px auto;

      text-align: center;

      color: #6f8c90;
    }

    .no-results h3 {

      margin-bottom: 7px;

      color: #123b42;

      font-family: "Space Grotesk", sans-serif;
    }


    /* =========================================
       TABLET
    ========================================= */

    @media (max-width: 1050px) {

      .listings {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 650px) {

      .top-header {

        height: 64px;

        padding: 0 17px;
      }

      .logo {
        font-size: 18px;
      }

      .logo-icon {

        width: 27px;
        height: 27px;

        border-width: 2px;
      }

      .header-menu {
        display: none;
      }

      .menu-button {
        display: block;
      }


      .explore-page {

        padding: 18px 12px 50px;
      }


      /* HERO */

      .explore-hero {

        min-height: 0;

        border-radius: 20px;
      }

      .hero-content {

        width: 100%;

        padding: 25px 17px 20px;
      }

      .hero-label {
        font-size: 9px;
      }

      .hero-content h1 {

        font-size: 43px;

        letter-spacing: -1.5px;
      }

      .hero-content p {

        max-width: 275px;

        margin: 12px 0 20px;

        font-size: 13px;
      }

      .hero-decoration {

        right: -100px;
        top: -40px;

        width: 370px;
        height: 260px;
      }


      /* =====================================
         FOJI IMAGE - MOBILE
      ====================================== */

      .hero-character {

        width: 210px;
        height: 100%;

        right: -5px;
        top: 0;
      }

      .hero-character img {

        opacity: .65;

        object-position: center bottom;
      }


      /* SEARCH */

      .search-row {

        position: relative;
        z-index: 5;

        gap: 7px;
      }

      .search-box {

        height: 44px;

        padding: 0 13px;
      }

      .search-icon {
        font-size: 23px;
      }

      .search-box input {
        font-size: 12px;
      }

      .filter-button {

        width: 46px;

        padding: 0;

        font-size: 0;
      }

      .filter-button span {

        margin: 0;

        font-size: 18px;
      }


      /* CATEGORIES */

      .categories {

        margin: 17px 0;

        gap: 8px;
      }

      .category {

        padding: 10px 17px;

        font-size: 12px;
      }


      /* LISTINGS */

      .listings {

        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 10px;
      }


      /* CARD */

      .card-image {
        height: 115px;
      }

      .card-content {
        padding: 10px;
      }

      .card-title {

        font-size: 13px;
      }

      .card-info {

        font-size: 10px;
      }

      .price {

        margin: 7px 0;

        font-size: 16px;
      }

      .seller {

        font-size: 10px;
      }

      .seller-avatar {

        width: 23px;
        height: 23px;
      }

      .details {

        height: 33px;

        margin-top: 9px;

        font-size: 10px;
      }

      .badge {

        top: 7px;
        left: 7px;

        padding: 5px 8px;

        font-size: 8px;
      }

      .favorite {

        top: 7px;
        right: 7px;

        width: 27px;
        height: 27px;

        font-size: 18px;
      }


      /* POP */

      .pop-heart {
        font-size: 25px;
      }

      .pop-number {
        font-size: 20px;
      }

      .pop-text {
        font-size: 9px;
      }


      /* UC */

      .uc-box {

        padding: 12px 22px;
      }

      .uc-box strong {
        font-size: 31px;
      }

      .uc-box span {
        font-size: 9px;
      }


      /* MYTHIC */

      .mythic-icon {
        font-size: 55px;
      }


      /* ROYAL */

      .royal-content strong {
        font-size: 40px;
      }

      .royal-content span {
        font-size: 8px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================================
       HEADER
  ========================================== -->

  <header class="top-header">

    <div class="logo">

      <div class="logo-icon"></div>

      LOOTSHOOT

    </div>


    <!-- No Sign In / Sign Up -->

    <nav class="header-menu">

      <a href="#">Marketplace</a>
      <a href="#">How it works</a>
      <a href="#">FAQ</a>

    </nav>


    <button class="menu-button">
      ☰
    </button>

  </header>



  <!-- =========================================
       EXPLORE
  ========================================== -->

  <main class="explore-page">


    <!-- HERO -->

    <section class="explore-hero">

      <div class="hero-content">

        <span class="hero-label">
          LOOTSHOOT MARKETPLACE
        </span>

        <h1>
          Explore
        </h1>

        <p>
          Find the best PUBG Mobile accounts, POP and more from trusted sellers.
        </p>


        <div class="search-row">

          <div class="search-box">

            <span class="search-icon">
              ⌕
            </span>

            <input
              type="text"
              id="searchInput"
              placeholder="Search accounts, POP & items..."
            >

          </div>


          <button
            class="filter-button"
            type="button"
          >

            <span>☰</span>

            Filters

          </button>

        </div>

      </div>


      <!-- Decorative background -->

      <div class="hero-decoration"></div>


      <!-- =====================================
           FOJI.PNG CHARACTER
      ====================================== -->

      <div class="hero-character">

        <img
          src="foji.png"
          alt="LootShoot PUBG Soldier"
        >

      </div>

    </section>



    <!-- =========================================
         CATEGORIES
    ========================================== -->

    <div class="categories">

      <button
        class="category active"
        data-category="all"
      >
        All
      </button>

      <button
        class="category"
        data-category="accounts"
      >
        Accounts
      </button>

      <button
        class="category"
        data-category="pop"
      >
        POP
      </button>

      <button
        class="category"
        data-category="other"
      >
        Other Items
      </button>

    </div>



    <!-- =========================================
         LISTINGS
         POPULATED FROM SUPABASE
    ========================================== -->

    <section
      class="listings"
      id="listings"
    ></section>



    <!-- NO RESULTS / EMPTY STATE -->

    <div
      class="no-results"
      id="noResults"
    >

      <h3>No listings found</h3>

      <p>Try another search or category.</p>

    </div>


  </main>



  <!-- =========================================
       JAVASCRIPT
  ========================================== -->

  <script>

    const listingsSection =
      document.getElementById("listings");

    const noResults =
      document.getElementById("noResults");

    const searchInput =
      document.getElementById("searchInput");

    const categoryButtons =
      document.querySelectorAll(".category");


    let selectedCategory = "all";


    /* =========================================
       SUPABASE
    ========================================= */

    const supabaseUrl =
      "https://saguwhkijrdiwiabxvyv.supabase.co";

    const supabaseKey =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhZ3V3aGtpanJkaXdpYWJ4dnl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMTQ1ODEsImV4cCI6MjEwNDY5MDU4MX0.onEJePT4-Ijz-O9R8E3RRoFVaqwY1mIez-F9Xy0xUbQ";

    const supabaseClient =
      window.supabase.createClient(
        supabaseUrl,
        supabaseKey
      );


    /* =========================================
       LOAD ADS FROM SUPABASE
    ========================================= */

    async function getAllAds() {

      const {
        data: ads,
        error
      } =
        await supabaseClient
          .from("ads")
          .select("*")
          .order(
            "created_at",
            { ascending: false }
          );

      if (error) {

        console.error(
          "Could not load ads:",
          error
        );

        return [];

      }

      return ads || [];

    }


    async function getSellersByIds(sellerIds) {

      if (!sellerIds.length) {
        return {};
      }

      const {
        data: sellers,
        error
      } =
        await supabaseClient
          .from("sellers")
          .select("id, username, avatar_url")
          .in("id", sellerIds);

      if (error) {

        console.error(
          "Could not load sellers:",
          error
        );

        return {};

      }

      const sellerMap = {};

      (sellers || []).forEach(seller => {
        sellerMap[seller.id] = seller;
      });

      return sellerMap;

    }


    /* =========================================
       AD TYPE HELPERS
    ========================================= */

    function getAdTypeLabel(type) {

      const normalized =
        String(type || "").toLowerCase();

      if (normalized === "account") {
        return "Account";
      }

      if (normalized === "pop") {
        return "POP";
      }

      return "Other Item";

    }

    function getAdBadgeClass(type) {

      const normalized =
        String(type || "").toLowerCase();

      if (normalized === "pop") {
        return "badge-pop";
      }

      if (normalized === "other") {
        return "badge-other";
      }

      return "";

    }

    function getAdListingCategory(type) {

      const normalized =
        String(type || "").toLowerCase();

      if (normalized === "account") {
        return "accounts";
      }

      if (normalized === "pop") {
        return "pop";
      }

      return "other";

    }

    function getInitials(name) {

      if (!name) {
        return "S";
      }

      return name
        .split(" ")
        .map(part => part[0])
        .join("")
        .slice(0, 2)
        .toUpperCase();

    }

    function escapeHTML(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

    function openAdDetails(adId) {

      window.location.href =
        "ad-details.html?id=" +
        encodeURIComponent(adId);

    }


    /* =========================================
       BUILD A LISTING CARD
    ========================================= */

    function buildAdCard(ad, seller) {

      const card =
        document.createElement("article");

      card.className = "card";

      card.dataset.category =
        getAdListingCategory(ad.type);

      const image =
        Array.isArray(ad.images) && ad.images.length
          ? ad.images[0]
          : "";

      const imageHTML =
        image
          ? `<img src="${escapeHTML(image)}" alt="${escapeHTML(ad.title || "Ad image")}">`
          : "";

      const badgeClass =
        getAdBadgeClass(ad.type);

      const badgeLabel =
        getAdTypeLabel(ad.type);

      const sellerName =
        (seller && seller.username) || "Seller";

      const sellerAvatarHTML =
        (seller && seller.avatar_url)
          ? `<img src="${escapeHTML(seller.avatar_url)}" alt="${escapeHTML(sellerName)}">`
          : escapeHTML(getInitials(sellerName));

      card.innerHTML = `

        <div class="card-image">

          ${imageHTML}

          <span class="badge ${badgeClass}">
            ${escapeHTML(badgeLabel)}
          </span>

          <button class="favorite">
            ♡
          </button>

        </div>


        <div class="card-content">

          <h3 class="card-title">
            ${escapeHTML(ad.title || "Untitled Ad")}
          </h3>

          <p class="card-info">
            ${escapeHTML(ad.description || "")}
          </p>

          <div class="price">
            Rs. ${Number(ad.price || 0).toLocaleString()}
          </div>

          <div class="seller">

            <div class="seller-avatar">
              ${sellerAvatarHTML}
            </div>

            ${escapeHTML(sellerName)}

          </div>

          <button class="details">
            View Details <span>→</span>
          </button>

        </div>

      `;

      card
        .querySelector(".favorite")
        .addEventListener("click", event => {

          event.stopPropagation();

          const button = event.currentTarget;

          button.classList.toggle("liked");

          button.textContent =
            button.classList.contains("liked")
              ? "♥"
              : "♡";

        });

      card
        .querySelector(".details")
        .addEventListener("click", event => {

          event.stopPropagation();

          openAdDetails(ad.id);

        });

      return card;

    }


    /* =========================================
       LOAD + RENDER LISTINGS
    ========================================= */

    async function loadListings() {

      listingsSection.innerHTML = `
        <div
          class="no-results"
          style="display:block; grid-column: 1 / -1;"
        >
          <h3>Loading listings...</h3>
        </div>
      `;

      noResults.style.display = "none";

      const ads =
        await getAllAds();

      if (!ads.length) {

        listingsSection.innerHTML = "";

        noResults.querySelector("h3").textContent =
          "No listings yet";

        noResults.querySelector("p").textContent =
          "Check back soon for new listings.";

        noResults.style.display = "block";

        return;

      }

      const sellerIds =
        [...new Set(ads.map(ad => ad.seller_id))];

      const sellerMap =
        await getSellersByIds(sellerIds);

      listingsSection.innerHTML = "";

      ads.forEach(ad => {

        const card =
          buildAdCard(
            ad,
            sellerMap[ad.seller_id]
          );

        listingsSection.appendChild(card);

      });

      filterListings();

    }


    /* =========================================
       CATEGORY BUTTONS
    ========================================= */

    categoryButtons.forEach(button => {

      button.addEventListener("click", () => {

        categoryButtons.forEach(btn => {
          btn.classList.remove("active");
        });

        button.classList.add("active");

        selectedCategory =
          button.dataset.category;

        filterListings();

      });

    });


    /* =========================================
       SEARCH
    ========================================= */

    searchInput.addEventListener(
      "input",
      filterListings
    );


    /* =========================================
       FILTER FUNCTION
    ========================================= */

    function filterListings() {

      const cards =
        listingsSection.querySelectorAll(".card");

      if (!cards.length) {
        return;
      }

      const search =
        searchInput.value
          .toLowerCase()
          .trim();

      let visibleCards = 0;

      cards.forEach(card => {

        const category =
          card.dataset.category;

        const text =
          card.innerText.toLowerCase();

        const categoryMatch =
          selectedCategory === "all" ||
          category === selectedCategory;

        const searchMatch =
          search === "" ||
          text.includes(search);

        if (categoryMatch && searchMatch) {

          card.style.display = "";

          visibleCards++;

        } else {

          card.style.display = "none";

        }

      });

      if (visibleCards === 0) {

        noResults.querySelector("h3").textContent =
          "No listings found";

        noResults.querySelector("p").textContent =
          "Try another search or category.";

        noResults.style.display = "block";

      } else {

        noResults.style.display = "none";

      }

    }


    loadListings();

  </script>

</body>
