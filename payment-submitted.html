<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="LootShoot — Your payment has been submitted for review."
  />

  <title>LootShoot — Payment Submitted</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: #111827;
      font-family: "DM Sans", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .submitted-card {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .payment-badge {
      width: 96px;
      height: 96px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: linear-gradient(145deg, #eafaf1, #dff3eb);
      display: grid;
      place-items: center;
      box-shadow: 0 12px 30px rgba(21, 150, 90, 0.15);
    }

    .payment-badge svg {
      width: 46px;
      height: 46px;
    }

    /* The check mark draws itself once when the page opens */
    .payment-check {
      stroke-dasharray: 24;
      stroke-dashoffset: 24;
      animation: draw-check 0.6s ease-out 0.35s forwards;
    }

    @keyframes draw-check {
      to {
        stroke-dashoffset: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .payment-check {
        animation: none;
        stroke-dashoffset: 0;
      }
    }

    h1 {
      margin: 0 0 14px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 24px;
      letter-spacing: -0.02em;
      color: #111827;
    }

    p {
      margin: 0 0 30px;
      color: #6d777f;
      font-size: 14px;
      line-height: 1.7;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 24px;
      border: none;
      border-radius: 30px;
      background: #15965a;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 22px rgba(21, 150, 90, 0.22);
      transition: 0.2s ease;
    }

    .back-button:hover {
      background: #107e4b;
      transform: translateY(-2px);
    }

    .back-button:focus-visible {
      outline: 2px solid #15965a;
      outline-offset: 3px;
    }
  </style>
  <!-- DARK THEME: uses the choice saved from the main page. Runs before the page draws, so there is no white flash. -->
<script>
  (function () {
    var theme = "light";
    try {
      theme = localStorage.getItem("lootshootTheme") === "dark" ? "dark" : "light";
    } catch (e) {}
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="stylesheet" href="dark-status.css">
</head>

<body>

  <div class="submitted-card">

    <div class="payment-badge">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="#15965a"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="2" y="5" width="20" height="14" rx="3" />
        <path d="M2 10h20" />
        <path class="payment-check" d="M8.5 15l2.3 2.3 4.7-4.8" />
      </svg>
    </div>

    <h1>Payment submitted</h1>

    <p>
      We have received your payment details and will review them shortly.
      Once your payment is approved, you will be notified.
    </p>

    <a id="adButton" class="back-button" href="seller-dashboard.html">
      Back to Explore →
    </a>

  </div>

  <script>
    const storedAdId = sessionStorage.getItem('paymentSubmittedAdId');
    const adId = storedAdId || new URLSearchParams(window.location.search).get('id');

    const adButton = document.getElementById('adButton');

    if (adId && /^[0-9a-fA-F-]{36}$/.test(adId)) {
      const adUrl = 'ad-details.html?id=' + encodeURIComponent(adId);
      adButton.href = adUrl;
      adButton.textContent = 'Back to ad →';

      adButton.addEventListener('click', () => {
        sessionStorage.setItem('adDetailsReturnUrl', 'explore.html');
        sessionStorage.setItem('paymentSubmittedAdId', adId);
      });
    } else {
      adButton.href = 'explore.html';
      adButton.textContent = 'Back to explore →';
    }
  </script>
</body>
</html>
