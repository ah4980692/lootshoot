<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Dashboard - LootShoot</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
  rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

  :root {
    --primary: #0c4b32;
    --primary-hover: #08603c;
    --accent: #25a56a;
    --accent-dark: #1c9560;
    --bg: #f4faf6;
    --text: #123c2a;
    --muted: #718078;
    --muted-2: #7b8982;
    --border: #d8e7de;
    --border-2: #e7eee9;
    --light-green: #d9f5e5;
    --light-green-2: #eef9f2;
    --red: #a83232;
    --red-bg: #f8e5e5;
    --red-bg-2: #fce0e0;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  button,
  input,
  textarea {
    font-family: inherit;
  }

  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* App shell — narrow centered card on mobile/tablet, wider card on desktop.
     This mirrors A's original shell so that explore.html (loaded in the
     iframe below) and the ads grids get the same available width they
     had in A, instead of the full-bleed width B used. */

  .app-shell {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    background: var(--bg);
  }

  @media (min-width: 600px) {

    .app-shell {
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

  }

  @media (min-width: 900px) {

    body {
      padding: 28px;
      background: #edf3f7;
    }

    .app-shell {
      max-width: 1200px;
      width: min(1200px, calc(100vw - 100px));
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(23, 34, 48, 0.12);
    }

  }

  /* Header */

  .dashboard-header {
    background: var(--primary);
    color: white;
    padding: 18px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 1px;
  }

  .seller-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .seller-name {
    font-size: 14px;
    font-weight: 600;
  }

  .seller-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--light-green);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    overflow: hidden;
    flex-shrink: 0;
  }

  .seller-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Layout */

  .dashboard {
    padding: 22px 18px 100px;
  }

  @media (min-width: 900px) {

    .dashboard {
      padding: 28px 28px 110px;
    }

  }

  .section {
    display: none;
  }

  .section.active {
    display: block;
  }

  .section-title {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .section-subtitle {
    color: var(--muted);
    margin-bottom: 25px;
  }

  /* Explore — sized the same way A sized it, so explore.html renders
     at the width/height it was actually built for. */

  .explore-frame {
    display: block;
    width: 100%;
    height: calc(100vh - 118px);
    min-height: 620px;
    border: 0;
    border-radius: 12px;
    background: #f5fcf9;
  }

  /* Messages */

  .message {
    display: none;
    margin-bottom: 18px;
    padding: 12px 14px;
    border-radius: 9px;
    font-size: 14px;
  }

  .message.error {
    display: block;
    background: var(--red-bg-2);
    color: var(--red);
  }

  .message.success {
    display: block;
    background: var(--light-green);
    color: #17633f;
  }

  /* Create Ad */

  .form-card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 8px 30px rgba(12, 75, 50, 0.07);
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group > label {
    display: block;
    font-weight: 700;
    margin-bottom: 8px;
    font-size: 14px;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    outline: none;
    background: #fbfefc;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    border-color: var(--accent);
  }

  .form-group textarea {
    min-height: 130px;
    resize: vertical;
  }

  .image-note {
    font-size: 13px;
    color: var(--muted-2);
    margin-top: 7px;
  }

  /* Type select */

  .type-select {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }

  .type-option {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 14px 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--light-green-2);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
  }

  .type-option.selected {
    background: var(--light-green);
    border-color: var(--accent);
    color: var(--primary);
  }

  .type-icon {
    font-size: 1.3rem;
  }

  /* Photo uploader */

  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-top: 4px;
  }

  .photo-thumb {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .photo-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .photo-remove {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    color: white;
    font-size: 0.8rem;
    cursor: pointer;
  }

  .photo-add {
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    background: var(--light-green-2);
    color: var(--muted);
    font-size: 0.68rem;
    font-weight: 700;
    cursor: pointer;
  }

  .photo-add-icon {
    font-size: 1.3rem;
    color: var(--accent);
  }

  .publish-button {
    width: 100%;
    background: var(--primary);
    color: white;
    border: none;
    padding: 15px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }

  .publish-button:hover {
    background: var(--primary-hover);
  }

  .publish-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .review-note {
    margin-top: 15px;
    background: var(--light-green-2);
    padding: 13px;
    border-radius: 10px;
    font-size: 13px;
    color: #42715b;
  }

  /* My Ads — 2 per row by default (like A), 4 per row on desktop */

  .ads-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  @media (min-width: 900px) {

    .ads-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

  }

  .my-ad-card {
    overflow: hidden;
    background: #ffffff;
    font-family: "DM Sans", sans-serif;
    border: 1px solid #dceee7;
    border-radius: 17px;
    box-shadow: 0 7px 25px rgba(16, 90, 65, 0.08);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .my-ad-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(16, 90, 65, 0.13);
  }

  .my-ad-image {
    position: relative;
    height: 155px;
    overflow: hidden;
    background: #dff2e9;
  }

  .my-ad-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .ad-badge {
    position: absolute;
    left: 10px;
    top: 10px;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 800;
    color: #06352a;
    z-index: 2;
  }

  .ad-badge-pop {
    background: #71e9ba;
  }

  .ad-badge-account {
    background: #6ff0bb;
  }

  .ad-badge-other {
    background: #8ce8c3;
  }

  .ad-delete-btn {
    position: absolute;
    right: 10px;
    top: 10px;
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 50%;
    background: white;
    color: var(--red);
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }

  .ad-delete-btn:hover {
    background: var(--red-bg);
  }

  .my-ad-content {
    padding: 15px;
  }

  .my-ad-title {
    margin-bottom: 5px;
    color: #092f36;
    font-family: "Space Grotesk", sans-serif;
    font-size: 16px;
    line-height: 1.3;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .my-ad-desc {
    margin: 0;
    color: #7a979b;
    font-size: 12px;
    line-height: 1.5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .my-ad-price {
    margin: 10px 0;
    color: #15965a;
    font-size: 20px;
    font-weight: 800;
  }

  .my-ad-seller {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #25474d;
    font-size: 12px;
    font-weight: 700;
  }

  .seller-avatar-sm {
    width: 27px;
    height: 27px;
    border-radius: 50%;
    background: #d9f4e8;
    color: #15965a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: inherit;
    overflow: hidden;
    flex-shrink: 0;
  }

  .seller-avatar-sm img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .view-details-btn {
    width: 100%;
    height: 39px;
    margin-top: 13px;
    border: 1px solid #64d4aa;
    border-radius: 20px;
    background: #ffffff;
    color: #15965a;
    padding: 0;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.2s ease;
  }

  .view-details-btn:hover {
    background: #15965a;
    color: #ffffff;
  }

  .view-details-btn span {
    margin-left: 6px;
  }

  @media (max-width: 600px) {

    .my-ad-image {
      height: 115px;
    }

    .my-ad-content {
      padding: 10px;
    }

    .my-ad-title {
      font-size: 13px;
    }

    .my-ad-desc {
      font-size: 10px;
    }

    .my-ad-price {
      margin: 7px 0;
      font-size: 16px;
    }

    .my-ad-seller {
      font-size: 10px;
    }

    .seller-avatar-sm {
      width: 23px;
      height: 23px;
    }

    .view-details-btn {
      height: 39px;
      padding: 0;
      font-size: 13px;
    }

    .ad-badge {
      top: 7px;
      left: 7px;
      padding: 5px 8px;
      font-size: 8px;
    }

    .ad-delete-btn {
      top: 7px;
      right: 7px;
      width: 27px;
      height: 27px;
      font-size: 13px;
    }

  }

  .empty-message {
    background: white;
    padding: 30px;
    border-radius: 15px;
    color: var(--muted-2);
    text-align: center;
  }

  .loading {
    text-align: center;
    padding: 30px;
    color: var(--muted-2);
  }

  /* Profile */

  .profile-card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(12, 75, 50, 0.07);
  }

  .profile-top {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
  }

  .profile-avatar-large {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--light-green);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 26px;
    font-weight: 800;
    color: var(--primary);
    flex-shrink: 0;
  }

  .profile-avatar-large img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .profile-role {
    font-weight: 700;
    margin-bottom: 6px;
  }

  .profile-status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--light-green-2);
    color: #17633f;
    font-size: 12px;
    font-weight: 700;
  }

  .profile-status-pill::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #28c76f;
  }

  .profile-row {
    border-bottom: 1px solid var(--border-2);
    padding: 14px 0;
  }

  .profile-label {
    font-size: 12px;
    color: var(--muted-2);
    margin-bottom: 4px;
  }

  .profile-value {
    font-weight: 700;
    word-break: break-word;
  }

  .profile-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
  }

  .profile-btn {
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .profile-btn.primary {
    background: var(--primary);
    color: white;
  }

  .profile-btn.primary:hover {
    background: var(--primary-hover);
  }

  .profile-btn.secondary {
    background: var(--red-bg);
    color: var(--red);
  }

  .profile-btn.secondary:hover {
    background: var(--red-bg-2);
  }

  /* Bottom Navigation — structure/style ported from A: a floating
     rounded pill bar, centered, with stacked icon+label nav items. */

  .seller-bottom-nav {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 0;
    width: min(96vw, 480px);
    background: rgba(255, 255, 255, 0.98);
    border: 1px solid rgba(22, 41, 61, 0.08);
    border-bottom: none;
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -8px 20px rgba(26, 38, 55, 0.08);
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    padding: 8px 6px 10px;
    z-index: 1000;
  }

  .nav-item {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--muted-2);
    border-radius: 12px;
    padding: 8px 6px;
    min-height: 52px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-size: 0.62rem;
    font-weight: 700;
    cursor: pointer;
  }

  .nav-item .icon {
    font-size: 1.12rem;
    line-height: 1;
  }

  .nav-item.active {
    background: var(--light-green-2);
    color: var(--primary);
    border: 1px solid rgba(12, 75, 50, 0.15);
  }

  @media (max-width: 600px) {

    .dashboard-header {
      padding: 15px;
    }

    .brand {
      font-size: 19px;
    }

    .seller-name {
      display: none;
    }

    .section-title {
      font-size: 23px;
    }

  }

</style>
</head>
<body>

<div class="app-shell">

  <header class="dashboard-header">

    <div class="brand">LOOTSHOOT</div>

    <div class="seller-info">

      <div class="seller-name" id="sellerName">Seller</div>

      <div class="seller-avatar" id="headerAvatar">
        <span id="headerAvatarInitials">S</span>
        <img id="headerAvatarImage" src="" alt="" style="display:none;">
      </div>

    </div>

  </header>

  <main class="dashboard">

    <!-- EXPLORE -->
    <section id="exploreSection" class="section active">

      <iframe
        class="explore-frame"
        src="explore.html"
        title="LootShoot marketplace"
      ></iframe>

    </section>

    <!-- NOTIFICATIONS -->
    <section id="notificationsSection" class="section">

      <div class="section-title">Notifications</div>

      <div class="empty-message">
        You have no new notifications right now.
      </div>

    </section>

    <!-- CREATE AD -->
    <section id="createSection" class="section">

      <div class="section-title">Sell Now</div>

      <div id="formMessage" class="message"></div>

      <div class="form-card">

        <form id="offerForm" novalidate>

          <div class="form-group">

            <label>What are you selling?</label>

            <div class="type-select">

              <button type="button" class="type-option" data-type="pop">
                <span class="type-icon">🔥</span>
                <span>POP</span>
              </button>

              <button type="button" class="type-option" data-type="account">
                <span class="type-icon">🎮</span>
                <span>Account</span>
              </button>

              <button type="button" class="type-option" data-type="other">
                <span class="type-icon">📦</span>
                <span>Other</span>
              </button>

            </div>

            <input type="hidden" id="offerType">

          </div>

          <div class="form-group">
            <label for="offerTitle">Title</label>
            <input type="text" id="offerTitle" placeholder="e.g. 5,000 PUBG Popularity">
          </div>

          <div class="form-group">
            <label for="offerPrice">Price (PKR)</label>
            <input type="text" id="offerPrice" inputmode="numeric" placeholder="e.g. 499">
          </div>

          <div class="form-group">
            <label for="offerDescription">Description</label>
            <textarea id="offerDescription" placeholder="Describe your offer..."></textarea>
          </div>

          <div class="form-group">

            <label>Photos</label>

            <input
              type="file"
              id="offerPhotos"
              accept="image/jpeg,image/png,image/webp"
              multiple
              hidden
            >

            <div class="photo-grid" id="photoGrid">

              <button type="button" class="photo-add" id="photoAddBtn">
                <span class="photo-add-icon">+</span>
                <span>Add photo</span>
              </button>

            </div>

            <div class="image-note">
              Up to 5 photos, JPG or PNG.
            </div>

          </div>

          <button type="submit" class="publish-button" id="publishButton">
            Publish Offer
          </button>

          <div class="review-note">
            Your offer will be reviewed before it appears on the marketplace.
          </div>

        </form>

      </div>

    </section>

    <!-- MY ADS -->
    <section id="myAdsSection" class="section">

      <div class="section-title">My Ads</div>

      <div id="myAdsContainer">
        <div class="loading">Loading your ads...</div>
      </div>

    </section>

    <!-- PROFILE -->
    <section id="profileSection" class="section">

      <div class="section-title">My Profile</div>

      <div class="profile-card">

        <div class="profile-top">

          <div class="profile-avatar-large" id="profileAvatar">
            <span id="profileAvatarLetter">S</span>
            <img id="profileAvatarImage" src="" alt="" style="display:none;">
          </div>

          <div>
            <div class="profile-role">Verified seller</div>
            <div class="profile-status-pill">Active</div>
          </div>

        </div>

        <div class="profile-row">
          <div class="profile-label">Username</div>
          <div class="profile-value" id="profileUsername">—</div>
        </div>

        <div class="profile-row">
          <div class="profile-label">Email</div>
          <div class="profile-value" id="profileEmail">—</div>
        </div>

        <div class="profile-row">
          <div class="profile-label">WhatsApp Number</div>
          <div class="profile-value" id="profileWhatsapp">—</div>
        </div>

        <div class="profile-row">
          <div class="profile-label">Member Since</div>
          <div class="profile-value" id="profileMemberSince">—</div>
        </div>

        <div class="profile-actions">
          <button type="button" class="profile-btn primary" id="editProfileBtn">Edit Profile</button>
          <button type="button" class="profile-btn secondary" id="logoutButton">Logout</button>
        </div>

      </div>

    </section>

  </main>

  <nav class="seller-bottom-nav">

    <button class="nav-item active" type="button" data-target="exploreSection">
      <span class="icon">⌂</span>
      <span>Explore</span>
    </button>

    <button class="nav-item" type="button" data-target="notificationsSection">
      <span class="icon">🔔</span>
      <span>Notifications</span>
    </button>

    <button class="nav-item" type="button" data-target="createSection">
      <span class="icon">＋</span>
      <span>Sell Now</span>
    </button>

    <button class="nav-item" type="button" data-target="myAdsSection">
      <span class="icon">🧾</span>
      <span>My Ads</span>
    </button>

    <button class="nav-item" type="button" data-target="profileSection">
      <span class="icon">👤</span>
      <span>My Profile</span>
    </button>

  </nav>

</div>

<script>

  /* =========================================================
     SUPABASE
  ========================================================= */

  const supabaseUrl =
    "https://saguwhkijrdiwiabxvyv.supabase.co";

  const supabaseKey =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhZ3V3aGtpanJkaXdpYWJ4dnl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMTQ1ODEsImV4cCI6MjEwNDY5MDU4MX0.onEJePT4-Ijz-O9R8E3RRoFVaqwY1mIez-F9Xy0xUbQ";

  const supabaseClient =
    window.supabase.createClient(supabaseUrl, supabaseKey);


  /* =========================================================
     NAVIGATION
  ========================================================= */

  const navButtons = document.querySelectorAll(".nav-item");
  const sections = document.querySelectorAll(".section");

  function activateTab(target) {

    navButtons.forEach(btn => {
      btn.classList.toggle("active", btn.dataset.target === target);
    });

    sections.forEach(sec => {
      sec.classList.toggle("active", sec.id === target);
    });

    if (target === "profileSection") {
      syncProfileFromSupabase();
    }

    if (target === "myAdsSection") {
      renderMyAds();
    }

  }

  navButtons.forEach(btn => {
    btn.addEventListener("click", () => activateTab(btn.dataset.target));
  });

  const requestedTab = new URLSearchParams(window.location.search).get("tab");

  if (requestedTab === "my-ads") {
    activateTab("myAdsSection");
  }


  /* =========================================================
     RESTORE AUTH SESSION (hash handoff from login/signup)
  ========================================================= */

  async function restoreAuthHandoff() {

    const authValue =
      new URLSearchParams(window.location.hash.replace(/^#/, "")).get("auth");

    if (!authValue) {
      return;
    }

    try {

      const session = JSON.parse(authValue);

      const { error } = await supabaseClient.auth.setSession(session);

      if (error) {
        throw error;
      }

      sessionStorage.setItem("sellerAuthSession", JSON.stringify(session));

      window.history.replaceState(null, document.title, window.location.pathname);

    } catch (error) {

      console.error("Could not restore sign-in session:", error);

    }

  }


  /* =========================================================
     GET AUTHENTICATED USER
  ========================================================= */

  async function getAuthenticatedUser() {

    await restoreAuthHandoff();

    try {

      let { data: sessionData, error: sessionError } =
        await supabaseClient.auth.getSession();

      if (sessionError) {
        console.warn("getSession error:", sessionError);
      }

      /* If Supabase has no session, try our stored session. */

      if (!sessionData?.session) {

        const storedSession =
          sessionStorage.getItem("sellerAuthSession") ||
          localStorage.getItem("sellerAuthSession");

        if (storedSession) {

          try {

            const parsedSession = JSON.parse(storedSession);

            const { data, error } =
              await supabaseClient.auth.setSession(parsedSession);

            if (error) {
              throw error;
            }

            sessionData = data;

            if (data?.session) {
              sessionStorage.setItem("sellerAuthSession", JSON.stringify(data.session));
            }

          } catch (error) {

            console.warn("Stored session could not be restored:", error);

            sessionStorage.removeItem("sellerAuthSession");
            localStorage.removeItem("sellerAuthSession");

          }

        }

      }

      /* Refresh expired session. */

      if (
        sessionData?.session?.expires_at &&
        sessionData.session.expires_at <= Math.floor(Date.now() / 1000)
      ) {

        const { data, error } = await supabaseClient.auth.refreshSession({
          refresh_token: sessionData.session.refresh_token
        });

        if (!error && data?.session) {
          sessionData = data;
          sessionStorage.setItem("sellerAuthSession", JSON.stringify(data.session));
        }

      }

      /* Get the real Supabase Auth user. */

      let { data: userData, error: userError } =
        await supabaseClient.auth.getUser();

      /* One more refresh attempt if necessary. */

      if (userError && sessionData?.session?.refresh_token) {

        const { data: refreshedData, error: refreshError } =
          await supabaseClient.auth.refreshSession({
            refresh_token: sessionData.session.refresh_token
          });

        if (!refreshError && refreshedData?.session) {

          sessionStorage.setItem("sellerAuthSession", JSON.stringify(refreshedData.session));

          ({ data: userData, error: userError } = await supabaseClient.auth.getUser());

        }

      }

      if (userData?.user) {
        console.log("Logged-in user:", userData.user.id);
        return userData.user;
      }

    } catch (error) {

      console.warn("Supabase authentication could not be restored:", error);

    }

    /* Fallback to stored seller ID. */

    const fallbackUserId =
      sessionStorage.getItem("sellerSessionUserId") ||
      localStorage.getItem("sellerSessionUserId");

    if (fallbackUserId) {

      console.warn("Using fallback seller user ID:", fallbackUserId);

      return {
        id: fallbackUserId,
        email:
          sessionStorage.getItem("sellerSessionEmail") ||
          localStorage.getItem("sellerSessionEmail") ||
          "",
        user_metadata: {}
      };

    }

    console.error("Supabase authentication failed: no active session");

    return null;

  }


  /* =========================================================
     PROFILE ELEMENTS
  ========================================================= */

  const sellerNameEl = document.getElementById("sellerName");
  const headerAvatarImage = document.getElementById("headerAvatarImage");
  const headerAvatarInitials = document.getElementById("headerAvatarInitials");
  const profileAvatarImage = document.getElementById("profileAvatarImage");
  const profileAvatarLetter = document.getElementById("profileAvatarLetter");
  const profileUsernameEl = document.getElementById("profileUsername");
  const profileEmailEl = document.getElementById("profileEmail");
  const profileWhatsappEl = document.getElementById("profileWhatsapp");
  const profileMemberSinceEl = document.getElementById("profileMemberSince");

  function getInitials(name) {

    if (!name) {
      return "S";
    }

    return name.split(" ").map(part => part[0]).join("").slice(0, 2).toUpperCase();

  }


  /* =========================================================
     POPULATE PROFILE
     Checks localStorage first for cached username/whatsapp/avatar,
     so the header + profile card render instantly, before
     Supabase responds.
  ========================================= */

  function populateProfile(profileData = {}) {

    const username =
      profileData.username ||
      localStorage.getItem("sellerSessionUsername") ||
      sessionStorage.getItem("sellerSessionUsername") ||
      sessionStorage.getItem("signupUsername") ||
      "Seller Name";

    const email =
      profileData.email ||
      localStorage.getItem("sellerSessionEmail") ||
      sessionStorage.getItem("sellerSessionEmail") ||
      sessionStorage.getItem("signupEmail") ||
      "seller@example.com";

    const whatsapp =
      profileData.whatsapp ||
      localStorage.getItem("sellerSessionWhatsApp") ||
      sessionStorage.getItem("sellerSessionWhatsApp") ||
      sessionStorage.getItem("signupWhatsApp") ||
      "+92 300 1234567";

    profileEmailEl.textContent = email;
    profileWhatsappEl.textContent = whatsapp;

    if (profileData.created_at) {

      const joinedDate = new Date(profileData.created_at);

      if (!Number.isNaN(joinedDate.getTime())) {
        profileMemberSinceEl.textContent =
          joinedDate.toLocaleString("en-US", { month: "long", year: "numeric" });
      }

    } else {

      profileMemberSinceEl.textContent =
        new Date().toLocaleString("en-US", { month: "long", year: "numeric" });

    }

    sellerNameEl.textContent = username;
    profileUsernameEl.textContent = username;

    const initials = getInitials(username);

    headerAvatarInitials.textContent = initials;
    profileAvatarLetter.textContent = initials;

    /*
      Avatar priority:
      1. Freshly-fetched Supabase data (profileData.avatar_url)
      2. localStorage cache (survives closing the browser)
      3. sessionStorage cache (same-tab fallback)
    */

    const profilePic =
      profileData.avatar_url ||
      localStorage.getItem("sellerProfileImage") ||
      sessionStorage.getItem("sellerProfileImage");

    if (profilePic) {

      headerAvatarImage.src = profilePic;
      headerAvatarImage.style.display = "block";
      headerAvatarInitials.style.display = "none";

      profileAvatarImage.src = profilePic;
      profileAvatarImage.style.display = "block";
      profileAvatarLetter.style.display = "none";

    } else {

      headerAvatarImage.removeAttribute("src");
      headerAvatarImage.style.display = "none";
      headerAvatarInitials.style.display = "block";

      profileAvatarImage.removeAttribute("src");
      profileAvatarImage.style.display = "none";
      profileAvatarLetter.style.display = "block";

    }

  }

  /* Show cached profile immediately. */
  populateProfile();


  /* =========================================================
     SYNC PROFILE DIRECTLY FROM SUPABASE
     Caches to both sessionStorage and localStorage, so the
     photo survives a fresh login / new browser session.
  ========================================= */

  async function syncProfileFromSupabase() {

    try {

      const user = await getAuthenticatedUser();

      if (!user) {
        console.warn("No authenticated Supabase user yet.");
        return;
      }

      const { data: seller, error: sellerError } = await supabaseClient
        .from("sellers")
        .select("id, username, email, whatsapp, avatar_url, created_at")
        .eq("id", user.id)
        .maybeSingle();

      if (sellerError) {
        console.error("Seller profile query error:", sellerError);
        return;
      }

      if (!seller) {
        console.warn("Seller profile not found for user:", user.id);
        return;
      }

      if (seller.username) {
        sessionStorage.setItem("sellerSessionUsername", seller.username);
        localStorage.setItem("sellerSessionUsername", seller.username);
      }

      if (seller.email) {
        sessionStorage.setItem("sellerSessionEmail", seller.email);
        localStorage.setItem("sellerSessionEmail", seller.email);
      } else if (user.email) {
        sessionStorage.setItem("sellerSessionEmail", user.email);
        localStorage.setItem("sellerSessionEmail", user.email);
      }

      if (seller.whatsapp) {
        sessionStorage.setItem("sellerSessionWhatsApp", seller.whatsapp);
        localStorage.setItem("sellerSessionWhatsApp", seller.whatsapp);
      }

      if (seller.avatar_url) {
        sessionStorage.setItem("sellerProfileImage", seller.avatar_url);
        localStorage.setItem("sellerProfileImage", seller.avatar_url);
      }

      populateProfile({
        username: seller.username,
        email: seller.email || user.email,
        whatsapp: seller.whatsapp,
        avatar_url: seller.avatar_url,
        created_at: seller.created_at
      });

    } catch (error) {

      console.error("Could not sync seller profile:", error);

    }

  }


  /* =========================================================
     PROFILE LOADER AFTER LOGIN
  ========================================================= */

  async function loadProfileAfterLogin() {

    /* Give Supabase a moment to restore the authentication session. */
    await new Promise(resolve => setTimeout(resolve, 500));

    await syncProfileFromSupabase();

    /* Second attempt, in case auth restoration takes longer. */
    setTimeout(async () => {
      await syncProfileFromSupabase();
    }, 1500);

  }

  loadProfileAfterLogin();

  supabaseClient.auth.onAuthStateChange((event, session) => {

    if (event === "SIGNED_IN" || event === "TOKEN_REFRESHED") {
      setTimeout(async () => {
        await syncProfileFromSupabase();
      }, 500);
    }

  });


  /* =========================================================
     MY ADS
  ========================================================= */

  async function getMyAds() {

    const user = await getAuthenticatedUser();

    if (!user) {
      console.error("Could not get authenticated user:", "No active Supabase session");
      return [];
    }

    const { data: ads, error } = await supabaseClient
      .from("ads")
      .select("*")
      .eq("seller_id", user.id)
      .order("created_at", { ascending: false });

    if (error) {
      console.error("Could not load ads:", error);
      return [];
    }

    return ads || [];

  }

  function getAdTypeLabel(type) {

    const normalized = String(type || "").toLowerCase();

    if (normalized === "account") {
      return "Account";
    }

    if (normalized === "pop") {
      return "POP";
    }

    return "Other Item";

  }

  function getAdBadgeClass(type) {

    const normalized = String(type || "").toLowerCase();

    if (normalized === "pop") {
      return "ad-badge-pop";
    }

    if (normalized === "other") {
      return "ad-badge-other";
    }

    return "ad-badge-account";

  }

  function openAdDetails(adId) {
    window.location.href = "ad-details.html?id=" + encodeURIComponent(adId);
  }

  function escapeHTML(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

  function formatPrice(price) {

    const number = Number(price);

    if (Number.isNaN(number)) {
      return "Rs. —";
    }

    return "Rs. " + number.toLocaleString();

  }

  async function renderMyAds() {

    const container = document.getElementById("myAdsContainer");

    container.innerHTML = `<div class="loading">Loading your ads...</div>`;

    const ads = await getMyAds();

    if (!ads.length) {
      container.innerHTML =
        `<div class="empty-message">You haven't posted any ads yet.</div>`;
      return;
    }

    const sellerName =
      localStorage.getItem("sellerSessionUsername") ||
      sessionStorage.getItem("sellerSessionUsername") ||
      sessionStorage.getItem("signupUsername") ||
      "Seller";

    const sellerPhoto =
      localStorage.getItem("sellerProfileImage") ||
      sessionStorage.getItem("sellerProfileImage");

    const grid = document.createElement("div");
    grid.className = "ads-grid";

    ads.forEach(ad => {
      grid.appendChild(buildMyAdCard(ad, sellerName, sellerPhoto));
    });

    container.innerHTML = "";
    container.appendChild(grid);

  }

  function buildMyAdCard(ad, sellerName, sellerPhoto) {

    const card = document.createElement("article");
    card.className = "my-ad-card";

    const image =
      Array.isArray(ad.images) && ad.images.length ? ad.images[0] : "";

    const imageHTML = image
      ? `<img src="${escapeHTML(image)}" alt="${escapeHTML(ad.title || "Ad image")}">`
      : "";

    const badgeClass = getAdBadgeClass(ad.type);
    const badgeLabel = getAdTypeLabel(ad.type);

    const sellerAvatarHTML = sellerPhoto
      ? `<span class="seller-avatar-sm"><img src="${escapeHTML(sellerPhoto)}" alt="${escapeHTML(sellerName)}"></span>`
      : `<span class="seller-avatar-sm">${escapeHTML(getInitials(sellerName))}</span>`;

    card.innerHTML = `
      <div class="my-ad-image">
        ${imageHTML}
        <span class="ad-badge ${badgeClass}">${escapeHTML(badgeLabel)}</span>
        <button type="button" class="ad-delete-btn" aria-label="Delete ad" title="Delete ad">🗑</button>
      </div>
      <div class="my-ad-content">
        <h3 class="my-ad-title">${escapeHTML(ad.title || "Untitled Ad")}</h3>
        <p class="my-ad-desc">${escapeHTML(ad.description || "")}</p>
        <div class="my-ad-price">${formatPrice(ad.price)}</div>
        <div class="my-ad-seller">${sellerAvatarHTML}${escapeHTML(sellerName)}</div>
        <button type="button" class="view-details-btn">View Details <span>→</span></button>
      </div>
    `;

    const deleteBtn = card.querySelector(".ad-delete-btn");

    deleteBtn.addEventListener("click", async event => {

      event.preventDefault();
      event.stopPropagation();

      const confirmed = confirm("Delete this ad?");

      if (!confirmed) {
        return;
      }

      deleteBtn.disabled = true;

      try {

        const user = await getAuthenticatedUser();

        if (!user) {
          throw new Error("You must be signed in.");
        }

        if (Array.isArray(ad.images) && ad.images.length) {

          const filePaths = ad.images
            .map(url => {
              const marker = "/storage/v1/object/public/ad-images/";
              const index = url.indexOf(marker);
              if (index === -1) {
                return null;
              }
              return decodeURIComponent(url.substring(index + marker.length));
            })
            .filter(Boolean);

          if (filePaths.length) {

            const { error: storageError } = await supabaseClient
              .storage
              .from("ad-images")
              .remove(filePaths);

            if (storageError) {
              console.warn("Could not remove some images:", storageError);
            }

          }

        }

        const { error: deleteError } = await supabaseClient
          .from("ads")
          .delete()
          .eq("id", ad.id)
          .eq("seller_id", user.id);

        if (deleteError) {
          throw deleteError;
        }

        renderMyAds();

      } catch (error) {

        console.error("Could not delete ad:", error);

        alert("Could not delete this ad. Please try again.");

        deleteBtn.disabled = false;

      }

    });

    const viewDetailsBtn = card.querySelector(".view-details-btn");

    viewDetailsBtn.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();
      openAdDetails(ad.id);
    });

    card.addEventListener("click", event => {

      if (event.target.closest(".ad-delete-btn")) {
        return;
      }

      if (event.target.closest(".view-details-btn")) {
        return;
      }

      openAdDetails(ad.id);

    });

    return card;

  }

  renderMyAds();


  /* =========================================================
     CREATE OFFER — TYPE SELECT
  ========================================================= */

  const typeOptions = document.querySelectorAll(".type-option");
  const offerTypeInput = document.getElementById("offerType");

  typeOptions.forEach(option => {

    option.addEventListener("click", () => {

      typeOptions.forEach(item => {
        item.classList.toggle("selected", item === option);
      });

      offerTypeInput.value = option.dataset.type;

    });

  });


  /* =========================================================
     PHOTO UPLOAD
  ========================================================= */

  const MAX_OFFER_PHOTOS = 5;

  let offerPhotoFiles = [];

  const photoGrid = document.getElementById("photoGrid");
  const photoAddBtn = document.getElementById("photoAddBtn");
  const offerPhotosInput = document.getElementById("offerPhotos");

  function renderPhotoGrid() {

    photoGrid.querySelectorAll(".photo-thumb").forEach(thumb => thumb.remove());

    offerPhotoFiles.forEach((file, index) => {

      const thumb = document.createElement("div");
      thumb.className = "photo-thumb";

      const img = document.createElement("img");
      img.src = URL.createObjectURL(file);
      img.alt = "Offer photo";

      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "photo-remove";
      removeBtn.textContent = "×";

      removeBtn.addEventListener("click", () => {
        offerPhotoFiles.splice(index, 1);
        renderPhotoGrid();
      });

      thumb.appendChild(img);
      thumb.appendChild(removeBtn);

      photoGrid.insertBefore(thumb, photoAddBtn);

    });

    photoAddBtn.style.display =
      offerPhotoFiles.length >= MAX_OFFER_PHOTOS ? "none" : "flex";

  }

  photoAddBtn.addEventListener("click", () => offerPhotosInput.click());

  offerPhotosInput.addEventListener("change", () => {

    const newFiles = Array.from(offerPhotosInput.files || []);

    const imageFiles = newFiles.filter(file => file.type.startsWith("image/"));

    const room = MAX_OFFER_PHOTOS - offerPhotoFiles.length;

    offerPhotoFiles = offerPhotoFiles.concat(imageFiles.slice(0, room));

    offerPhotosInput.value = "";

    renderPhotoGrid();

  });

  renderPhotoGrid();


  /* =========================================================
     SUBMIT OFFER
  ========================================================= */

  const offerForm = document.getElementById("offerForm");
  const formMessage = document.getElementById("formMessage");

  function showFormMessage(message, type) {
    formMessage.textContent = message;
    formMessage.className = "message " + type;
  }

  offerForm.addEventListener("submit", async e => {

    e.preventDefault();

    formMessage.className = "message";
    formMessage.textContent = "";

    const type = offerTypeInput.value;
    const title = document.getElementById("offerTitle").value.trim();
    const priceText = document.getElementById("offerPrice").value.trim();
    const description = document.getElementById("offerDescription").value.trim();

    if (!type) {
      showFormMessage("Choose what you are selling.", "error");
      return;
    }

    if (!title) {
      showFormMessage("Enter an offer title.", "error");
      return;
    }

    if (!priceText) {
      showFormMessage("Enter a price.", "error");
      return;
    }

    const numericPrice = Number(priceText.replace(/,/g, ""));

    if (!Number.isFinite(numericPrice) || numericPrice <= 0) {
      showFormMessage("Enter a valid price.", "error");
      return;
    }

    if (!description) {
      showFormMessage("Add a short description.", "error");
      return;
    }

    if (offerPhotoFiles.length > MAX_OFFER_PHOTOS) {
      showFormMessage("You can upload up to 5 photos.", "error");
      return;
    }

    const publishButton = document.getElementById("publishButton");

    publishButton.disabled = true;
    publishButton.textContent = "Publishing...";

    let uploadedPaths = [];

    try {

      const user = await getAuthenticatedUser();

      if (!user) {
        throw new Error("You must be signed in to publish an offer.");
      }

      const adId = crypto.randomUUID();

      const imageUrls = [];

      for (let index = 0; index < offerPhotoFiles.length; index++) {

        const file = offerPhotoFiles[index];

        const extension = file.name.includes(".")
          ? file.name.split(".").pop().toLowerCase()
          : "jpg";

        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "-").slice(0, 80);

        const filePath =
          `${user.id}/${adId}/${Date.now()}-${index}-${safeName || `image.${extension}`}`;

        const { error: uploadError } = await supabaseClient
          .storage
          .from("ad-images")
          .upload(filePath, file, {
            cacheControl: "3600",
            upsert: false,
            contentType: file.type
          });

        if (uploadError) {
          throw uploadError;
        }

        uploadedPaths.push(filePath);

        const { data: publicUrlData } = supabaseClient
          .storage
          .from("ad-images")
          .getPublicUrl(filePath);

        imageUrls.push(publicUrlData.publicUrl);

      }

      const nowIso = new Date().toISOString();

      const { error: insertError } = await supabaseClient
        .from("ads")
        .insert({
          id: adId,
          seller_id: user.id,
          type: type,
          title: title,
          price: numericPrice,
          description: description,
          images: imageUrls,
          created_at: nowIso
        });

      if (insertError) {
        throw insertError;
      }

      window.location.href = "offer-submitted.html";

    } catch (error) {

      console.error("Could not publish offer:", error);

      if (uploadedPaths.length) {

        const { error: cleanupError } = await supabaseClient
          .storage
          .from("ad-images")
          .remove(uploadedPaths);

        if (cleanupError) {
          console.warn("Could not clean up uploaded images:", cleanupError);
        }

      }

      showFormMessage(
        error?.message || "Could not save your offer. Please try again.",
        "error"
      );

      publishButton.disabled = false;
      publishButton.textContent = "Publish Offer";

    }

  });


  /* =========================================================
     EDIT PROFILE
  ========================================================= */

  document.getElementById("editProfileBtn").addEventListener("click", () => {
    window.location.href = "edit-profile.html";
  });


  /* =========================================================
     LOGOUT
     Also clears the localStorage profile cache keys, so the
     next login doesn't briefly show a previous user's cached
     name/photo.
  ========================================================= */

  document.getElementById("logoutButton").addEventListener("click", async () => {

    try {
      await supabaseClient.auth.signOut();
    } catch (error) {
      console.warn("Supabase logout error:", error);
    }

    sessionStorage.clear();

    localStorage.removeItem("sellerAuthSession");
    localStorage.removeItem("sellerSessionUserId");
    localStorage.removeItem("sellerSessionEmail");
    localStorage.removeItem("sellerSessionUsername");
    localStorage.removeItem("sellerSessionWhatsApp");
    localStorage.removeItem("sellerProfileImage");

    window.location.href = "index.html";

  });

</script>

</body>
</html>
