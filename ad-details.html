<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ad Details - LootShoot</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    :root {
      --green: #15965a;
      --green-dark: #107e4b;
      --green-light: #e7faee;
      --ink: #111827;
      --sub: #6d777f;
      --line: #e5eee8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'DM Sans', Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #ffffff 0%, #f5fff9 45%, #ffffff 100%);
      color: var(--ink);
    }

    body .nav-bar,
    body .bottom-nav,
    body .navigation-bar,
    body .seller-bottom-nav,
    .seller-bottom-nav {
      display: none !important;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 90px;
      position: relative;
    }

    .topbar {
      height: 64px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .back-btn {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink);
      border-radius: 12px;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(20, 70, 45, 0.06);
    }

    .topbar-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    /* IMAGE AREA */

    .image-section {
      position: relative;
      background: #f4faf6;
    }

    .image-counter {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 4;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(17, 24, 39, 0.72);
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
    }

    .image-slider {
      width: 100%;
      height: auto;
      display: flex;
      align-items: flex-start;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
    }

    .image-slider::-webkit-scrollbar {
      display: none;
    }

    .slide {
      min-width: 100%;
      height: auto;
      scroll-snap-align: start;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: #f4faf6;
    }

    .slide-backdrop {
      position: absolute;
      inset: -18px;
      width: calc(100% + 36px) !important;
      height: calc(100% + 36px) !important;
      object-fit: cover !important;
      filter: blur(18px);
      opacity: 0.45;
      transform: scale(1.08);
    }

    .slide-image {
      position: relative;
      z-index: 1;
      width: 100%;
      height: auto !important;
      object-fit: contain;
      display: block;
    }

    .slide img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .no-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e7ecf2 0%, #dce7f0 100%);
      border: 2px dashed #b0bec5;
      border-radius: 12px;
      flex-direction: column;
      gap: 12px;
      color: #6d777f;
    }

    .no-image-icon {
      font-size: 3rem;
      opacity: 0.4;
    }

    .no-image-text {
      font-size: 1rem;
      font-weight: 600;
      opacity: 0.6;
    }

    /* IMAGE THUMBNAILS */

    .dots {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      padding: 12px 14px;
      overflow-x: auto;
      background: #f4faf6;
      scrollbar-width: none;
    }

    .dots::-webkit-scrollbar {
      display: none;
    }

    .dot {
      flex: 0 0 64px;
      width: 64px;
      height: 52px;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 10px;
      overflow: hidden;
      background: #dceee7;
      cursor: pointer;
    }

    .dot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .dot.active {
      border-color: #25a56a;
      box-shadow: 0 0 0 1px rgba(37, 165, 106, 0.2);
    }

    @media (max-width: 380px) {

      .dots {
        gap: 8px;
        padding: 10px;
      }

      .dot {
        flex-basis: 58px;
        width: 58px;
        height: 48px;
      }

    }

    /* DETAILS */

    .details {
      padding-bottom: 10px;
    }

    .details-header {
      background: transparent;
      padding: 22px 18px 14px;
      border-bottom: none;
      display: flex;
      flex-direction: column;
    }

    .title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      color: var(--ink);
    }

    .price {
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--green);
      margin-bottom: 4px;
    }

    .type-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      background: var(--green-light);
      color: #216f45;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      box-shadow: none;
      margin-top: 10px;
    }

    /* SELLER ROW */

    .contact-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      color: #4b5a52;
      font-size: 13px;
      text-decoration: none;
    }

    .contact-line b {
      color: var(--green);
      font-weight: 700;
    }

    .contact-line-icon {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #e7faee;
      color: #15965a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .seller-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 14px 18px 0;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #ffffff;
    }

    .seller-row .seller-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, var(--green), #17b56c);
      color: #ffffff;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      overflow: hidden;
      flex-shrink: 0;
    }

    .seller-row .seller-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .seller-row .seller-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
    }

    .seller-row .seller-sub {
      font-size: 11px;
      color: var(--sub);
      margin-top: 2px;
    }

    .details-section {
      padding: 18px 16px 20px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 16px;
      margin: 14px 18px 0;
      box-shadow: 0 6px 24px rgba(20, 70, 45, 0.05);
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 12px;
      opacity: 0.8;
    }

    .description-title {
      font-size: 0.7rem;
      font-weight: 700;
      color: #648073;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .description {
      color: #3f4b45;
      font-size: 0.9rem;
      line-height: 1.65;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .date {
      color: #93a09a;
      font-size: 0.78rem;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .divider {
      display: none;
    }

    /* ACTION BUTTONS */

    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e7ecf2;
    }

    .purchase-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      padding: 12px 16px 18px;
      border-top: 1px solid #e7ecf2;
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(100%, 480px);
      max-width: 480px;
      background: rgba(251, 254, 252, 0.98);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 30;
      box-shadow: 0 -8px 20px rgba(17, 24, 39, 0.08);
    }

    .action-btn,
    .purchase-btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .edit-btn {
      background: #25a56a;
      color: white;
    }

    .edit-btn:hover {
      background: #1f8556;
      box-shadow: 0 4px 12px rgba(37, 165, 106, 0.3);
    }

    .delete-btn {
      background: #f5e5e5;
      color: #a83232;
    }

    .delete-btn:hover {
      background: #fce0e0;
    }

    .make-offer-btn {
      background: #e9f8ef;
      color: #176e46;
      border: 1px solid #cfeedd;
    }

    .make-offer-btn:hover {
      background: #ddf3e8;
    }

    .buy-now-btn {
      background: #25a56a;
      color: white;
    }

    .buy-now-btn:hover {
      background: #1f8556;
      box-shadow: 0 4px 12px rgba(37, 165, 106, 0.3);
    }

    /* SIGN IN REQUIRED POPUP */

    .auth-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(16, 40, 27, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
    }

    .auth-modal-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .auth-modal {
      position: relative;
      width: 100%;
      max-width: 380px;
      padding: 32px 24px 24px;
      background: #ffffff;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(16, 40, 27, 0.25);
      transform: translateY(10px) scale(0.98);
      transition: transform 0.2s;
    }

    .auth-modal-backdrop.open .auth-modal {
      transform: none;
    }

    .auth-modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: #f3f6f4;
      color: #10281b;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.15s;
    }

    .auth-modal-close:hover {
      background: #dde6e0;
    }

    .auth-modal-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #e7f4ed;
      color: #15965a;
      display: grid;
      place-items: center;
    }

    .auth-modal-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #10281b;
      margin-bottom: 6px;
    }

    .auth-modal-subtitle {
      color: #5d6e64;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .auth-modal-buttons {
      display: flex;
      gap: 10px;
    }

    .auth-modal-btn {
      flex: 1;
      height: 48px;
      border-radius: 14px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .auth-modal-btn.secondary {
      border: 2px solid #15965a;
      background: transparent;
      color: #0f7a48;
    }

    .auth-modal-btn.secondary:hover {
      background: #e7f4ed;
    }

    .auth-modal-btn.primary {
      border: 2px solid #15965a;
      background: #15965a;
      color: white;
    }

    .auth-modal-btn.primary:hover {
      background: #0f7a48;
      border-color: #0f7a48;
    }

    @media (prefers-reduced-motion: reduce) {
      .auth-modal-backdrop,
      .auth-modal {
        transition: none;
      }
    }

    /* DELETE MODAL */

    .delete-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .delete-modal-backdrop.open {
      display: flex;
    }

    .delete-modal {
      background: white;
      border-radius: 16px;
      padding: 24px;
      max-width: 320px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .delete-modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #1e2430;
    }

    .delete-modal-text {
      font-size: 0.9rem;
      color: #6d777f;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .delete-modal-buttons {
      display: flex;
      gap: 10px;
    }

    .delete-modal-btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .delete-modal-btn.cancel {
      background: #e7ecf2;
      color: #1e2430;
    }

    .delete-modal-btn.cancel:hover {
      background: #dce7f0;
    }

    .delete-modal-btn.delete {
      background: #a83232;
      color: white;
    }

    .delete-modal-btn.delete:hover {
      background: #8b2a2a;
    }

    .not-found {
      padding: 50px 20px;
      text-align: center;
      color: #6d777f;
    }

    @media (min-width: 600px) {

      body {
        padding: 20px;
        background: #edf3f7;
      }

      .page {
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(25, 40, 60, 0.1);
      }

    }

    /* FULLSCREEN IMAGE VIEWER */

    .slide-image {
      cursor: zoom-in;
    }

    .image-viewer {
      position: fixed;
      inset: 0;
      z-index: 3000;
      background: rgba(0, 0, 0, 0.96);
      display: none;
    }

    .image-viewer.open {
      display: block;
    }

    .image-viewer-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
    }

    .image-viewer-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transform-origin: center center;
      will-change: transform;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      display: block;
    }

    .image-viewer-close {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 3;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .image-viewer-close:hover {
      background: rgba(255, 255, 255, 0.26);
    }

    .image-viewer-counter {
      position: absolute;
      top: 24px;
      left: 16px;
      z-index: 3;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
    }

    .image-viewer-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      display: none;
      place-items: center;
      cursor: pointer;
    }

    .image-viewer-arrow:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    .image-viewer-arrow.show {
      display: grid;
    }

    .image-viewer-arrow.next {
      right: 12px;
    }

    .image-viewer-arrow.prev {
      left: 12px;
    }

  </style>

</head>

<body>

<div class="page">

  <div class="topbar">

    <button
      class="back-btn"
      aria-label="Go back"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>

    <div class="topbar-title">
      Ad Details
    </div>

  </div>


  <!-- IMAGE SLIDER -->

  <div class="image-section">

    <div
      class="image-slider"
      id="imageSlider"
    ></div>

    <div
      class="image-counter"
      id="imageCounter"
      aria-live="polite"
    ></div>

    <div
      class="dots"
      id="dots"
    ></div>

  </div>


  <!-- DETAILS -->

  <div
    class="details"
    id="details"
  >

  </div>

</div>

<!-- SIGN IN REQUIRED POPUP -->
<div class="auth-modal-backdrop" id="signInModal">
  <div class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
    <button type="button" class="auth-modal-close" aria-label="Close" onclick="document.getElementById('signInModal').classList.remove('open');">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <div class="auth-modal-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </div>

    <div class="auth-modal-title" id="authModalTitle">Sign In Required</div>
    <div class="auth-modal-subtitle" id="authModalSubtitle">You must sign in or create an account to buy.</div>

    <div class="auth-modal-buttons">
      <button type="button" class="auth-modal-btn secondary" onclick="window.location.href='index.html';">Sign Up</button>
      <button type="button" class="auth-modal-btn primary" onclick="window.location.href='index.html';">Sign In</button>
    </div>
  </div>
</div>

<!-- DELETE CONFIRMATION MODAL -->
<div class="delete-modal-backdrop" id="deleteModalBackdrop">
  <div class="delete-modal">
    <div class="delete-modal-title">Delete this ad?</div>
    <div class="delete-modal-text">
      This action cannot be undone. The ad will be permanently deleted.
    </div>
    <div class="delete-modal-buttons">
      <button class="delete-modal-btn cancel" id="cancelDeleteBtn">Cancel</button>
      <button class="delete-modal-btn delete" id="confirmDeleteBtn">Delete</button>
    </div>
  </div>
</div>

<!-- FULLSCREEN IMAGE VIEWER -->
<div class="image-viewer" id="imageViewer" role="dialog" aria-modal="true" aria-label="Image viewer">

  <div class="image-viewer-counter" id="imageViewerCounter"></div>

  <button type="button" class="image-viewer-close" id="imageViewerClose" aria-label="Close image viewer">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>

  <button type="button" class="image-viewer-arrow prev" id="imageViewerPrev" aria-label="Previous image">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </button>

  <button type="button" class="image-viewer-arrow next" id="imageViewerNext" aria-label="Next image">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>

  <div class="image-viewer-stage" id="imageViewerStage">
    <img class="image-viewer-img" id="imageViewerImg" alt="" draggable="false">
  </div>

</div>

<script>

  /* =========================================
     FULLSCREEN IMAGE VIEWER
     - Opens when an ad image is tapped
     - Pinch / wheel / double-tap to zoom, drag to pan
     - Next image only changes via the arrow buttons
       (no swipe-to-change)
  ========================================= */

  (function () {

    const viewer = document.getElementById("imageViewer");
    const stage = document.getElementById("imageViewerStage");
    const viewerImg = document.getElementById("imageViewerImg");
    const viewerCounter = document.getElementById("imageViewerCounter");
    const closeBtn = document.getElementById("imageViewerClose");
    const prevBtn = document.getElementById("imageViewerPrev");
    const nextBtn = document.getElementById("imageViewerNext");

    const MIN_SCALE = 1;
    const MAX_SCALE = 6;
    const DOUBLE_TAP_SCALE = 2.5;
    const DOUBLE_TAP_MS = 300;
    const TAP_MOVE_LIMIT = 8;

    let viewerImages = [];
    let viewerIndex = 0;

    let scale = 1;
    let tx = 0;
    let ty = 0;

    const pointers = new Map();
    let pinchStartDist = 0;
    let pinchStartScale = 1;
    let panStart = null;
    let tapStart = null;
    let lastTap = { time: 0, x: 0, y: 0 };

    function clampPan() {

      if (scale <= 1) {
        tx = 0;
        ty = 0;
        return;
      }

      const maxX = Math.max(0, (viewerImg.offsetWidth * scale - stage.clientWidth) / 2);
      const maxY = Math.max(0, (viewerImg.offsetHeight * scale - stage.clientHeight) / 2);

      tx = Math.min(maxX, Math.max(-maxX, tx));
      ty = Math.min(maxY, Math.max(-maxY, ty));

    }

    function applyTransform() {

      clampPan();

      viewerImg.style.transform =
        `translate(${tx}px, ${ty}px) scale(${scale})`;

    }

    function resetZoom() {

      scale = 1;
      tx = 0;
      ty = 0;
      viewerImg.style.transform = "";

    }

    // Zoom while keeping the point under (clientX, clientY) fixed
    function zoomAt(newScale, clientX, clientY) {

      newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));

      const rect = stage.getBoundingClientRect();
      const cx = clientX - (rect.left + rect.width / 2);
      const cy = clientY - (rect.top + rect.height / 2);
      const ratio = newScale / scale;

      tx = cx - (cx - tx) * ratio;
      ty = cy - (cy - ty) * ratio;
      scale = newScale;

      applyTransform();

    }

    function showImage(index) {

      viewerIndex = index;

      resetZoom();

      viewerImg.src = viewerImages[index];

      viewerCounter.textContent =
        viewerImages.length > 1
          ? `${index + 1}/${viewerImages.length}`
          : "";

      prevBtn.classList.toggle("show", index > 0);
      nextBtn.classList.toggle("show", index < viewerImages.length - 1);

    }

    function openImageViewer(images, index) {

      if (!Array.isArray(images) || !images.length) {
        return;
      }

      viewerImages = images;

      pointers.clear();
      panStart = null;
      tapStart = null;

      showImage(Math.min(Math.max(index || 0, 0), images.length - 1));

      viewer.classList.add("open");
      document.body.style.overflow = "hidden";

    }

    function closeImageViewer() {

      viewer.classList.remove("open");
      document.body.style.overflow = "";

      pointers.clear();
      panStart = null;
      tapStart = null;

      viewerImg.removeAttribute("src");
      resetZoom();

    }

    window.openImageViewer = openImageViewer;

    closeBtn.addEventListener("click", closeImageViewer);

    nextBtn.addEventListener("click", () => {
      if (viewerIndex < viewerImages.length - 1) {
        showImage(viewerIndex + 1);
      }
    });

    prevBtn.addEventListener("click", () => {
      if (viewerIndex > 0) {
        showImage(viewerIndex - 1);
      }
    });

    document.addEventListener("keydown", (e) => {

      if (!viewer.classList.contains("open")) {
        return;
      }

      if (e.key === "Escape") {
        closeImageViewer();
      } else if (e.key === "ArrowRight" && viewerIndex < viewerImages.length - 1) {
        showImage(viewerIndex + 1);
      } else if (e.key === "ArrowLeft" && viewerIndex > 0) {
        showImage(viewerIndex - 1);
      }

    });

    window.addEventListener("resize", () => {
      if (viewer.classList.contains("open")) {
        applyTransform();
      }
    });

    /* Mouse wheel zoom (desktop) */

    stage.addEventListener("wheel", (e) => {

      e.preventDefault();

      const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;

      zoomAt(scale * factor, e.clientX, e.clientY);

    }, { passive: false });

    /* Pointer handling: pinch zoom, drag to pan, double-tap to zoom */

    function pointerDistance() {

      const [a, b] = Array.from(pointers.values());

      return Math.hypot(a.x - b.x, a.y - b.y);

    }

    function pointerMidpoint() {

      const [a, b] = Array.from(pointers.values());

      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };

    }

    stage.addEventListener("pointerdown", (e) => {

      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      try {
        stage.setPointerCapture(e.pointerId);
      } catch (err) {
        // ignore capture errors
      }

      if (pointers.size === 1) {

        tapStart = { x: e.clientX, y: e.clientY };
        panStart = { x: e.clientX, y: e.clientY, tx: tx, ty: ty };

      } else if (pointers.size === 2) {

        tapStart = null;
        panStart = null;
        pinchStartDist = pointerDistance() || 1;
        pinchStartScale = scale;

      }

    });

    stage.addEventListener("pointermove", (e) => {

      if (!pointers.has(e.pointerId)) {
        return;
      }

      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 2) {

        const mid = pointerMidpoint();

        zoomAt(pinchStartScale * (pointerDistance() / pinchStartDist), mid.x, mid.y);

        return;

      }

      if (tapStart && Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y) > TAP_MOVE_LIMIT) {
        tapStart = null;
      }

      if (pointers.size === 1 && panStart && scale > 1) {

        tx = panStart.tx + (e.clientX - panStart.x);
        ty = panStart.ty + (e.clientY - panStart.y);

        applyTransform();

      }

    });

    function endPointer(e, isCancel) {

      if (!pointers.has(e.pointerId)) {
        return;
      }

      const wasSingle = pointers.size === 1;

      pointers.delete(e.pointerId);

      if (wasSingle && tapStart && !isCancel) {

        const now = Date.now();

        const isDoubleTap =
          now - lastTap.time < DOUBLE_TAP_MS &&
          Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30;

        if (isDoubleTap) {

          if (scale > 1) {
            resetZoom();
          } else {
            zoomAt(DOUBLE_TAP_SCALE, e.clientX, e.clientY);
          }

          lastTap = { time: 0, x: 0, y: 0 };

        } else {

          lastTap = { time: now, x: e.clientX, y: e.clientY };

        }

      }

      tapStart = null;

      if (pointers.size === 1) {

        // Finger lifted after a pinch: continue panning with the remaining finger
        const remaining = Array.from(pointers.values())[0];

        panStart = { x: remaining.x, y: remaining.y, tx: tx, ty: ty };

      } else if (pointers.size === 0) {

        panStart = null;

      }

    }

    stage.addEventListener("pointerup", (e) => endPointer(e, false));
    stage.addEventListener("pointercancel", (e) => endPointer(e, true));

  })();

</script>

<script>

  function escapeHTML(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

     SUPABASE
  ========================================= */

    document.getElementById(
      "imageSlider"
    );

  const dots =
    document.getElementById(
      "dots"
    );

    document.getElementById(
      "imageCounter"
    );

        sessionStorage.removeItem("adDetailsFromMyAds");

  /* =========================================
     LOAD AD FROM SUPABASE
  ========================================= */

  async function getCurrentSellerId() {
    try {
      const { data: sessionData } = await supabaseClient.auth.getSession();
      const sessionUserId = sessionData?.session?.user?.id;
      if (sessionUserId) {
        return sessionUserId;
      }
    } catch (error) {
      console.warn("Could not read current seller session:", error);
    }

    return (
      sessionStorage.getItem("sellerSessionUserId") ||
      localStorage.getItem("sellerSessionUserId") ||
      null
    );
  }


  /* =========================================
     LOAD PUBLIC SELLER INFO
     Same get_public_seller RPC used on
     explore.html, so logged-out visitors
     can see the seller's username/avatar
     without exposing private info.
  ========================================= */

  async function getPublicSeller(sellerId) {

    if (!sellerId) {
      return null;
    }

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "get_public_seller",
        {
          p_seller_id: sellerId
        }
      );

    if (error) {
      console.error("Could not load seller:", sellerId, error);
      return null;
    }

    if (!data) {
      return null;
    }

    return {
      id: sellerId,
      username: data.username || "",
      avatar_url: data.avatar_url || ""
    };

  }

  function getInitials(name) {

    if (!name) {
      return "S";
    }

    return name
      .split(" ")
      .map(part => part[0])
      .join("")
      .slice(0, 2)
      .toUpperCase();

  }

  /* =========================================
     ACTIVE DEAL CHECK
     Returns true when a deal with status 'active'
     exists for the given ad id. On error, returns
     false (do not assume locked on query error).
  ========================================= */
  async function checkActiveDeal(adId) {
    if (!adId) return false;
    try {
      const { data: activeDeal, error } = await supabaseClient
        .from('deals')
        .select('id')
        .eq('ad_id', adId)
        .eq('status', 'active')
        .limit(1)
        .maybeSingle();

      if (error) {
        console.warn('Could not check active deal for ad', adId, error);
        return false;
      }

      return Boolean(activeDeal);
    } catch (err) {
      console.warn('Unexpected error while checking active deal for ad', adId, err);
      return false;
    }
  }

  function addLockIcon(el) {
    if (!el) return;
    if (el.querySelector && el.querySelector('.lock-icon')) return;
    const span = document.createElement('span');
    span.className = 'lock-icon';
    span.style.marginRight = '8px';
    span.setAttribute('aria-hidden', 'true');
    span.textContent = '🔒';
    if (el.firstChild) {
      el.insertBefore(span, el.firstChild);
    } else {
      el.appendChild(span);
    }
  }


  /* =========================================
     LOAD AD FROM SUPABASE
  ========================================= */

  async function loadAd() {

    if (!adId) {

      showNotFound();
      return;

    }


    console.log("Loading ad by id:", adId);

    const {
      data,
      error
    } = await supabaseClient
      .from("ads")
      .select(
        "id, type, title, price, description, images, created_at, seller_id"
      )
      .eq("id", adId);

    if (error) {
      console.error("Could not load ad:", error);
      showNotFound();
      return;
    }

    const ad = Array.isArray(data) ? data[0] : data;

    if (!ad) {
      console.error("No ad matched this id:", adId);
      showNotFound();
      return;
    }

    await renderAd(ad);

  }


  /* =========================================
     NOT FOUND
  ========================================= */

  function showNotFound() {

    slider.innerHTML = `
      <div class="slide">
        <div class="no-image">
          Ad not found
        </div>
      </div>
    `;

    dots.innerHTML = "";
    imageCounter.textContent = "";

    details.innerHTML = `
      <div class="not-found">
        This ad could not be found.
      </div>
    `;

  }


  /* =========================================
     RENDER AD
  ========================================= */

  async function renderAd(ad) {

    const images =
      Array.isArray(ad.images)
        ? ad.images
        : [];


    if (!images.length) {

      slider.innerHTML = `
        <div class="slide" style="background: #f4faf6; padding: 40px 20px;">
          <div class="no-image">
            <div class="no-image-icon">🖼️</div>
            <div class="no-image-text">No Image Available</div>
          </div>
        </div>
      `;

      dots.innerHTML = "";
      imageCounter.textContent = "";

    } else {

      function updateImageCounter(index) {
        imageCounter.textContent = `${index + 1}/${images.length}`;
      }

      function fitSliderToActiveImage() {

        const index = Math.round(
          slider.scrollLeft / slider.clientWidth
        );

        const activeSlide = slider.children[index];
        const activeImage = activeSlide?.querySelector(".slide-image");

        updateImageCounter(index);

        if (activeImage?.complete && activeImage.offsetHeight) {
          slider.style.height = `${activeImage.offsetHeight}px`;
        }

      }

      images.forEach(
        (image, index) => {

          const slide =
            document.createElement("div");

          slide.className =
            "slide";

          slide.innerHTML = `
            <img
              class="slide-backdrop"
              src="${escapeHTML(image)}"
              alt=""
              aria-hidden="true"
            >
            <img
              class="slide-image"
              src="${escapeHTML(image)}"
              alt="${escapeHTML(ad.title || "Ad image") }"
            >
          `;

          slider.appendChild(slide);

          slide
            .querySelector(".slide-image")
            .addEventListener("load", fitSliderToActiveImage);

          slide
            .querySelector(".slide-image")
            .addEventListener("click", () => openImageViewer(images, index));


          const dot =
            document.createElement("button");

          dot.type = "button";
          dot.setAttribute("aria-label", `View image ${index + 1}`);

          dot.innerHTML = `
            <img
              src="${escapeHTML(image)}"
              alt=""
            >
          `;

          dot.className =
            "dot" +
            (index === 0
              ? " active"
              : "");

          dots.appendChild(dot);

          dot.addEventListener("click", () => {
            updateImageCounter(index);
            slider.scrollTo({
              left: index * slider.clientWidth,
              behavior: "smooth"
            });
          });

        }
      );


      /* UPDATE DOT WHEN SWIPING */

      fitSliderToActiveImage();

      slider.addEventListener(
        "scroll",
        () => {

          const index =
            Math.round(
              slider.scrollLeft /
              slider.clientWidth
            );

          document
            .querySelectorAll(".dot")
            .forEach((dot, i) => {

              dot.classList.toggle(
                "active",
                i === index
              );

            });

          fitSliderToActiveImage();

        }
      );

    }


    /* =====================================
       DETAILS
    ===================================== */

    const createdDate =
      ad.created_at
        ? new Date(ad.created_at)
        : null;

    const fromMyAds = sessionStorage.getItem("adDetailsFromMyAds") === "true";
    const currentSellerId = await getCurrentSellerId();
    const isSellerOwner = Boolean(
      currentSellerId &&
      ad.seller_id &&
      String(currentSellerId) === String(ad.seller_id)
    );

    // My Ads flow should show Edit/Delete only for the seller's own listings.
    // If the same seller opens their ad from Explore, there should be no action buttons.
    const showSellerActions = fromMyAds && isSellerOwner;
    const showPurchaseButtons = !isSellerOwner && !fromMyAds;

    const seller = await getPublicSeller(ad.seller_id);
    const sellerName = (seller && seller.username) || "Seller";

    const sellerAvatarHTML =
      (seller && seller.avatar_url)
        ? `<img src="${escapeHTML(seller.avatar_url)}" alt="${escapeHTML(sellerName)}">`
        : escapeHTML(getInitials(sellerName));

    const whatsappMessage =
      `Hi, I'd like more information about this ad: "${ad.title || "Untitled Ad"}" (ID: ${ad.id})`;
    const whatsappLink =
      "https://wa.me/923411444759?text=" + encodeURIComponent(whatsappMessage);

    details.innerHTML = `

      <div class="details-header">
        <div class="title">
          ${escapeHTML(ad.title || "Untitled Ad")}
        </div>

        <div class="price">
          Rs. ${Number(
            ad.price || 0
          ).toLocaleString()}
        </div>
      </div>

      <div class="seller-row">
        <div class="seller-avatar">
          ${sellerAvatarHTML}
        </div>
        <div>
          <div class="seller-name">${escapeHTML(sellerName)}</div>
          <div class="seller-sub">Seller</div>
        </div>
      </div>

      <div class="details-section">
        <div class="description-title">
          Description
        </div>

        <div class="description"></div>

        ${
          createdDate
            ? `
              <div class="date">
                Posted ${createdDate.toLocaleDateString(
                  "en-US",
                  {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                  }
                )}
              </div>
            `
            : ""
        }

        <a class="contact-line" href="${whatsappLink}" target="_blank" rel="noopener">
          <span class="contact-line-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.39 1.26 4.82L2 22l5.42-1.36a9.9 9.9 0 0 0 4.62 1.14h.01c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.6 14.01c-.24.66-1.38 1.26-1.9 1.33-.49.07-1.09.1-1.76-.11-.4-.13-.93-.3-1.6-.59-2.82-1.22-4.66-4.05-4.8-4.24-.14-.19-1.15-1.53-1.15-2.92 0-1.39.73-2.07.99-2.35.26-.28.57-.35.76-.35.19 0 .38 0 .55.01.18.01.41-.07.64.49.24.57.81 1.97.88 2.11.07.14.12.31.02.5-.1.19-.15.31-.29.48-.14.17-.3.38-.43.51-.14.14-.29.29-.13.57.17.28.75 1.24 1.61 2.01 1.11.99 2.04 1.3 2.33 1.44.29.14.46.12.63-.07.17-.19.72-.84.91-1.13.19-.29.38-.24.64-.14.26.1 1.65.78 1.93.92.29.14.48.21.55.33.07.12.07.68-.17 1.34z"/></svg>
          </span>
          <span>Need more information? <b>Contact us</b></span>
        </a>

        ${
          showSellerActions
            ? `
              <div class="action-buttons">
                <button class="action-btn edit-btn" id="editAdBtn">Edit</button>
                <button class="action-btn delete-btn" id="deleteAdBtn">Delete</button>
              </div>
            `
            : showPurchaseButtons
              ? `
                <div class="purchase-buttons">
                  <button class="purchase-btn make-offer-btn" id="makeOfferBtn">Make an Offer</button>
                  <button class="purchase-btn buy-now-btn" id="buyNowBtn">Buy Now</button>
                </div>
              `
              : ""
        }
      </div>

    `;

    details.querySelector(".description").textContent =
      ad.description || "";

    // Check active deal status for this ad (initial load)
    const isLocked = await checkActiveDeal(ad.id);

    if (showSellerActions) {
      const editBtn = document.getElementById("editAdBtn");
      const deleteBtn = document.getElementById("deleteAdBtn");

      // If locked on initial load, visually mark buttons and disable them
      if (isLocked) {
        if (editBtn) {
          addLockIcon(editBtn);
          editBtn.disabled = true;
        }
        if (deleteBtn) {
          addLockIcon(deleteBtn);
          deleteBtn.disabled = true;
        }
      }

      if (editBtn) {
        editBtn.addEventListener("click", async () => {
          const lockedNow = await checkActiveDeal(ad.id);
          if (lockedNow) {
            alert('This ad is locked because it already has an active deal.');
            return;
          }

          sessionStorage.setItem("adDetailsFromMyAds", "true");
          sessionStorage.setItem("adDetailsIsApproved", "true");
          sessionStorage.setItem("editAdReturnUrl", window.location.href);
          sessionStorage.setItem("editAdPreviousPage", sessionStorage.getItem("adDetailsReturnUrl") || "seller-dashboard.html?tab=my-ads");
          window.location.href = "edit-ad.html?id=" + encodeURIComponent(ad.id);
        });
      }

      if (deleteBtn) {
        deleteBtn.addEventListener("click", async () => {
          const lockedNow = await checkActiveDeal(ad.id);
          if (lockedNow) {
            alert('This ad cannot be deleted because it has an active deal.');
            return;
          }

          const deleteModalBackdrop = document.getElementById("deleteModalBackdrop");
          const cancelDeleteBtn = document.getElementById("cancelDeleteBtn");
          const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");

          deleteModalBackdrop.classList.add("open");

          cancelDeleteBtn.onclick = () => {
            deleteModalBackdrop.classList.remove("open");
          };

          confirmDeleteBtn.onclick = async () => {
            // Final check immediately before deletion
            const lockedBeforeDelete = await checkActiveDeal(ad.id);
            if (lockedBeforeDelete) {
              deleteModalBackdrop.classList.remove("open");
              alert('This ad cannot be deleted because it has an active deal.');
              return;
            }

            deleteModalBackdrop.classList.remove("open");
            confirmDeleteBtn.disabled = true;

            try {
              console.log("Delete flow - original ad.images:", ad.images);

              // Normalize images field: could be array, JSON string, or single URL string
              let imagesField = ad.images;
              let imagesArr = [];

              if (Array.isArray(imagesField)) {
                imagesArr = imagesField.slice();
              } else if (typeof imagesField === "string" && imagesField.trim()) {
                try {
                  const parsed = JSON.parse(imagesField);
                  if (Array.isArray(parsed)) {
                    imagesArr = parsed;
                  } else if (typeof parsed === "string") {
                    imagesArr = [parsed];
                  }
                } catch (e) {
                  imagesArr = [imagesField];
                }
              }

              const marker = "/storage/v1/object/public/ad-images/";

              const filePaths = imagesArr
                .map(url => {
                  if (!url || typeof url !== "string") return null;
                  const idx = url.indexOf(marker);
                  if (idx === -1) return null;
                  return decodeURIComponent(url.substring(idx + marker.length));
                })
                .filter(Boolean);

              console.log("Delete flow - extracted file paths:", filePaths);

              if (filePaths.length) {
                const { data: removeData, error: removeError } = await supabaseClient
                  .storage
                  .from("ad-images")
                  .remove(filePaths);

                console.log("Delete flow - storage remove result:", { data: removeData, error: removeError });

                if (removeError) {
                  throw removeError;
                }
              } else {
                console.log("Delete flow - no storage file paths to remove for this ad");
              }

              console.log("Delete flow - storage deletion succeeded (or not required). Proceeding to DB deletion.");

              const { error } = await supabaseClient
                .from("ads")
                .delete()
                .eq("id", ad.id);

              if (error) throw error;

              window.location.href = "seller-dashboard.html?tab=my-ads";
            } catch (error) {
              console.error("Delete error:", error);
              alert("Failed to delete ad");
              confirmDeleteBtn.disabled = false;
            }
          };
        });
      }
    }

    if (showPurchaseButtons) {
      const makeOfferBtn = document.getElementById("makeOfferBtn");
      const buyNowBtn = document.getElementById("buyNowBtn");

      // If locked on initial load, mark and disable purchase actions and contact link
      if (isLocked) {
        if (makeOfferBtn) {
          addLockIcon(makeOfferBtn);
          makeOfferBtn.disabled = true;
        }
        if (buyNowBtn) {
          addLockIcon(buyNowBtn);
          buyNowBtn.disabled = true;
        }
      }

      if (makeOfferBtn) {
        makeOfferBtn.addEventListener("click", async () => {
          // Final active-deal check before allowing navigation
          const lockedNow = await checkActiveDeal(ad.id);
          if (lockedNow) {
            alert('This ad is locked because it already has an active deal.');
            return;
          }

          const user = await getCurrentSellerId();

          if (!user) {
            showSignInPopup("You must sign in or create an account to make an offer.");
            return;
          }

          sessionStorage.setItem("makeOfferAdId", String(ad.id));
          sessionStorage.setItem("makeOfferAdTitle", ad.title || "Untitled Ad");
          sessionStorage.setItem("makeOfferAdPrice", String(ad.price || 0));
          sessionStorage.setItem("makeOfferReturnUrl", window.location.href);
          window.location.href = "make-offer.html?id=" + encodeURIComponent(ad.id);
        });
      }

      if (buyNowBtn) {
        buyNowBtn.addEventListener("click", async () => {
          // Final active-deal check before allowing navigation to payment
          const lockedNow = await checkActiveDeal(ad.id);
          if (lockedNow) {
            alert('This ad is locked because it already has an active deal.');
            return;
          }

          const user = await getCurrentSellerId();

          if (!user) {
            showSignInPopup("You must sign in or create an account to buy.");
            return;
          }

          sessionStorage.setItem("buyAdId", String(ad.id));
          sessionStorage.setItem("buyAdTitle", ad.title || "Untitled Ad");
          sessionStorage.setItem("buyAdPrice", String(ad.price || 0));
          sessionStorage.setItem("buyNowReturnUrl", window.location.href);
          window.location.href = "buy-now.html?id=" + encodeURIComponent(ad.id) + "&price=" + encodeURIComponent(String(ad.price || 0));
        });
      }
    }

  }


  /* =========================================
     SIGN IN POPUP: open with a custom message
  ========================================= */

  function showSignInPopup(message) {
    const modal = document.getElementById("signInModal");
    const subtitle = document.getElementById("authModalSubtitle");

    if (subtitle && message) {
      subtitle.textContent = message;
    }

    if (modal) {
      modal.classList.add("open");
    }
  }


  /* =========================================
     SIGN IN POPUP: close on outside tap or Esc
  ========================================= */

  const signInModalEl = document.getElementById("signInModal");

  signInModalEl.addEventListener("click", (e) => {
    if (e.target === signInModalEl) signInModalEl.classList.remove("open");
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") signInModalEl.classList.remove("open");
  });


  /* =========================================
     START
  ========================================= */

  loadAd();

</script>

</body>
</html>
