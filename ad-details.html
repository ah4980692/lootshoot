<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ad Details - LootShoot</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #1e2430;
    }

    body .nav-bar,
    body .bottom-nav,
    body .navigation-bar,
    body .seller-bottom-nav,
    .seller-bottom-nav {
      display: none !important;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: #f4f7fb;
      padding-bottom: 40px;
    }

    .topbar {
      height: 64px;
      background: white;
      border-bottom: 1px solid #e7ecf2;
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border: none;
      background: #eef4ff;
      border-radius: 12px;
      font-size: 1.4rem;
      cursor: pointer;
    }

    .topbar-title {
      font-size: 1rem;
      font-weight: 700;
    }

    /* IMAGE AREA */

    .image-section {
      position: relative;
      background: #f4faf6;
    }

    .image-counter {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 4;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(17, 24, 39, 0.72);
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
    }

    .image-slider {
      width: 100%;
      height: auto;
      display: flex;
      align-items: flex-start;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
    }

    .image-slider::-webkit-scrollbar {
      display: none;
    }

    .slide {
      min-width: 100%;
      height: auto;
      scroll-snap-align: start;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: #f4faf6;
    }

    .slide-backdrop {
      position: absolute;
      inset: -18px;
      width: calc(100% + 36px) !important;
      height: calc(100% + 36px) !important;
      object-fit: cover !important;
      filter: blur(18px);
      opacity: 0.45;
      transform: scale(1.08);
    }

    .slide-image {
      position: relative;
      z-index: 1;
      width: 100%;
      height: auto !important;
      object-fit: contain;
      display: block;
    }

    .slide img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .no-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e7ecf2 0%, #dce7f0 100%);
      border: 2px dashed #b0bec5;
      border-radius: 12px;
      flex-direction: column;
      gap: 12px;
      color: #6d777f;
    }

    .no-image-icon {
      font-size: 3rem;
      opacity: 0.4;
    }

    .no-image-text {
      font-size: 1rem;
      font-weight: 600;
      opacity: 0.6;
    }

    /* IMAGE THUMBNAILS */

    .dots {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      padding: 12px 14px;
      overflow-x: auto;
      background: #f4faf6;
      scrollbar-width: none;
    }

    .dots::-webkit-scrollbar {
      display: none;
    }

    .dot {
      flex: 0 0 64px;
      width: 64px;
      height: 52px;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 10px;
      overflow: hidden;
      background: #dceee7;
      cursor: pointer;
    }

    .dot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .dot.active {
      border-color: #25a56a;
      box-shadow: 0 0 0 1px rgba(37, 165, 106, 0.2);
    }

    @media (max-width: 380px) {

      .dots {
        gap: 8px;
        padding: 10px;
      }

      .dot {
        flex-basis: 58px;
        width: 58px;
        height: 48px;
      }

    }

    /* DETAILS */

    .details {
      padding: 0;
    }

    .details-header {
      background: white;
      padding: 20px 18px;
      border-bottom: 1px solid #e7ecf2;
    }

    .price {
      font-size: 1.5rem;
      font-weight: 700;
      color: #25a56a;
      margin-bottom: 14px;
    }

    .title {
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 12px;
      color: #1e2430;
    }

    .type-badge {
      display: inline-block;
      background: linear-gradient(135deg, #25a56a, #1f6a4d);
      color: white;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(37, 165, 106, 0.2);
    }

    .details-section {
      padding: 20px 18px;
      background: #fbfefc;
      margin-bottom: 8px;
      border: none;
      border-top: 1px solid #d0ebe3;
      border-bottom: 1px solid #d0ebe3;
      border-radius: 0;
      margin: 12px 0;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #6d777f;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 12px;
      opacity: 0.8;
    }

    .description-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #000000;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .description {
      color: #000000;
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .date {
      color: #9ca3af;
      font-size: 0.8rem;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #e7ecf2;
    }

    .divider {
      display: none;
    }

    /* ACTION BUTTONS */

    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e7ecf2;
    }

    .action-btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .edit-btn {
      background: #25a56a;
      color: white;
    }

    .edit-btn:hover {
      background: #1f8556;
      box-shadow: 0 4px 12px rgba(37, 165, 106, 0.3);
    }

    .delete-btn {
      background: #f5e5e5;
      color: #a83232;
    }

    .delete-btn:hover {
      background: #fce0e0;
    }

    /* DELETE MODAL */

    .delete-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .delete-modal-backdrop.open {
      display: flex;
    }

    .delete-modal {
      background: white;
      border-radius: 16px;
      padding: 24px;
      max-width: 320px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .delete-modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #1e2430;
    }

    .delete-modal-text {
      font-size: 0.9rem;
      color: #6d777f;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .delete-modal-buttons {
      display: flex;
      gap: 10px;
    }

    .delete-modal-btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .delete-modal-btn.cancel {
      background: #e7ecf2;
      color: #1e2430;
    }

    .delete-modal-btn.cancel:hover {
      background: #dce7f0;
    }

    .delete-modal-btn.delete {
      background: #a83232;
      color: white;
    }

    .delete-modal-btn.delete:hover {
      background: #8b2a2a;
    }

    .not-found {
      padding: 50px 20px;
      text-align: center;
      color: #6d777f;
    }

    @media (min-width: 600px) {

      body {
        padding: 20px;
        background: #edf3f7;
      }

      .page {
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(25, 40, 60, 0.1);
      }

    }

  </style>

</head>

<body>

<div class="page">

  <div class="topbar">

    <button
      class="back-btn"
      aria-label="Go back"
    >
      ←
    </button>

    <div class="topbar-title">
      Ad Details
    </div>

  </div>


  <!-- IMAGE SLIDER -->

  <div class="image-section">

    <div
      class="image-slider"
      id="imageSlider"
    ></div>

    <div
      class="image-counter"
      id="imageCounter"
      aria-live="polite"
    ></div>

    <div
      class="dots"
      id="dots"
    ></div>

  </div>


  <!-- DETAILS -->

  <div
    class="details"
    id="details"
  >

  </div>

</div>

<!-- DELETE CONFIRMATION MODAL -->
<div class="delete-modal-backdrop" id="deleteModalBackdrop">
  <div class="delete-modal">
    <div class="delete-modal-title">Delete this ad?</div>
    <div class="delete-modal-text">
      This action cannot be undone. The ad will be permanently deleted.
    </div>
    <div class="delete-modal-buttons">
      <button class="delete-modal-btn cancel" id="cancelDeleteBtn">Cancel</button>
      <button class="delete-modal-btn delete" id="confirmDeleteBtn">Delete</button>
    </div>
  </div>
</div>

<script>

  function escapeHTML(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================================
     SUPABASE
  ========================================= */

  const supabaseUrl =
    "https://saguwhkijrdiwiabxvyv.supabase.co";

  const supabaseKey =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhZ3V3aGtpanJkaXdpYWJ4dnl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMTQ1ODEsImV4cCI6MjEwNDY5MDU4MX0.onEJePT4-Ijz-O9R8E3RRoFVaqwY1mIez-F9Xy0xUbQ";

  const supabaseClient =
    window.supabase.createClient(
      supabaseUrl,
      supabaseKey
    );


  /* =========================================
     GET AD ID FROM URL
  ========================================= */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const adId =
    params.get("id");


  const slider =
    document.getElementById(
      "imageSlider"
    );

  const dots =
    document.getElementById(
      "dots"
    );

  const imageCounter =
    document.getElementById(
      "imageCounter"
    );

  const details =
    document.getElementById(
      "details"
    );

  const backBtn =
    document.querySelector(
      ".back-btn"
    );

  if (backBtn) {
    backBtn.addEventListener(
      "click",
      () => {
        const returnUrl =
          sessionStorage.getItem("adDetailsReturnUrl");
        const fromIframe =
          sessionStorage.getItem("fromIframe") === "true";

        sessionStorage.removeItem("adDetailsFromMyAds");
        sessionStorage.removeItem("adDetailsIsApproved");

        if (returnUrl) {
          sessionStorage.removeItem("adDetailsReturnUrl");
          sessionStorage.removeItem("fromIframe");
          window.location.href = returnUrl;
          return;
        }

        history.back();
      }
    );
  }


  /* =========================================
     LOAD AD FROM SUPABASE
  ========================================= */

  async function loadAd() {

    if (!adId) {

      showNotFound();
      return;

    }


    console.log("Loading ad by id:", adId);

    const {
      data,
      error
    } = await supabaseClient
      .from("ads")
      .select(
        "id, type, title, price, description, images, created_at"
      )
      .eq("id", adId);

    if (error) {
      console.error("Could not load ad:", error);
      showNotFound();
      return;
    }

    const ad = Array.isArray(data) ? data[0] : data;

    if (!ad) {
      console.error("No ad matched this id:", adId);
      showNotFound();
      return;
    }

    renderAd(ad);

  }


  /* =========================================
     NOT FOUND
  ========================================= */

  function showNotFound() {

    slider.innerHTML = `
      <div class="slide">
        <div class="no-image">
          Ad not found
        </div>
      </div>
    `;

    dots.innerHTML = "";
    imageCounter.textContent = "";

    details.innerHTML = `
      <div class="not-found">
        This ad could not be found.
      </div>
    `;

  }


  /* =========================================
     RENDER AD
  ========================================= */

  function renderAd(ad) {


    /* =====================================
       IMAGES
    ===================================== */

    const images =
      Array.isArray(ad.images)
        ? ad.images
        : [];


    if (!images.length) {

      slider.innerHTML = `
        <div class="slide" style="background: #f4faf6; padding: 40px 20px;">
          <div class="no-image">
            <div class="no-image-icon">🖼️</div>
            <div class="no-image-text">No Image Available</div>
          </div>
        </div>
      `;

      dots.innerHTML = "";
      imageCounter.textContent = "";

    } else {

      function updateImageCounter(index) {
        imageCounter.textContent = `${index + 1}/${images.length}`;
      }

      function fitSliderToActiveImage() {

        const index = Math.round(
          slider.scrollLeft / slider.clientWidth
        );

        const activeSlide = slider.children[index];
        const activeImage = activeSlide?.querySelector(".slide-image");

        updateImageCounter(index);

        if (activeImage?.complete && activeImage.offsetHeight) {
          slider.style.height = `${activeImage.offsetHeight}px`;
        }

      }

      images.forEach(
        (image, index) => {

          const slide =
            document.createElement("div");

          slide.className =
            "slide";

          slide.innerHTML = `
            <img
              class="slide-backdrop"
              src="${escapeHTML(image)}"
              alt=""
              aria-hidden="true"
            >
            <img
              class="slide-image"
              src="${escapeHTML(image)}"
              alt="${escapeHTML(ad.title)}"
            >
          `;

          slider.appendChild(slide);

          slide
            .querySelector(".slide-image")
            .addEventListener("load", fitSliderToActiveImage);


          const dot =
            document.createElement("button");

          dot.type = "button";
          dot.setAttribute("aria-label", `View image ${index + 1}`);

          dot.innerHTML = `
            <img
              src="${escapeHTML(image)}"
              alt=""
            >
          `;

          dot.className =
            "dot" +
            (index === 0
              ? " active"
              : "");

          dots.appendChild(dot);

          dot.addEventListener("click", () => {
            updateImageCounter(index);
            slider.scrollTo({
              left: index * slider.clientWidth,
              behavior: "smooth"
            });
          });

        }
      );


      /* UPDATE DOT WHEN SWIPING */

      fitSliderToActiveImage();

      slider.addEventListener(
        "scroll",
        () => {

          const index =
            Math.round(
              slider.scrollLeft /
              slider.clientWidth
            );

          document
            .querySelectorAll(".dot")
            .forEach((dot, i) => {

              dot.classList.toggle(
                "active",
                i === index
              );

            });

          fitSliderToActiveImage();

        }
      );

    }


    /* =====================================
       DETAILS
    ===================================== */

    const createdDate =
      ad.created_at
        ? new Date(ad.created_at)
        : null;

    const fromMyAds = sessionStorage.getItem("adDetailsFromMyAds") === "true";
    const isApproved = sessionStorage.getItem("adDetailsIsApproved") === "true";
    const showActionButtons = fromMyAds && isApproved;

    details.innerHTML = `

      <div class="details-header">
        <div class="title">
          ${escapeHTML(ad.title)}
        </div>

        <div class="price">
          Rs ${Number(
            ad.price || 0
          ).toLocaleString()}
        </div>
      </div>

      <div class="details-section">
        <div class="description-title">
          Description
        </div>

        <div class="description"></div>

        ${
          createdDate
            ? `
              <div class="date">
                Posted ${createdDate.toLocaleDateString(
                  "en-US",
                  {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                  }
                )}
              </div>
            `
            : ""
        }

        ${
          showActionButtons
            ? `
              <div class="action-buttons">
                <button class="action-btn edit-btn" id="editAdBtn">Edit</button>
                <button class="action-btn delete-btn" id="deleteAdBtn">Delete</button>
              </div>
            `
            : ""
        }
      </div>

    `;

    details.querySelector(".description").textContent =
      ad.description || "";

    if (showActionButtons) {
      const editBtn = document.getElementById("editAdBtn");
      const deleteBtn = document.getElementById("deleteAdBtn");

      if (editBtn) {
        editBtn.addEventListener("click", () => {
          sessionStorage.setItem("adDetailsFromMyAds", "true");
          sessionStorage.setItem("adDetailsIsApproved", "true");
          sessionStorage.setItem("editAdReturnUrl", window.location.href);
          sessionStorage.setItem("editAdPreviousPage", sessionStorage.getItem("adDetailsReturnUrl") || "seller-dashboard.html?tab=my-ads");
          window.location.href = "edit-ad.html?id=" + encodeURIComponent(ad.id);
        });
      }

      if (deleteBtn) {
        deleteBtn.addEventListener("click", async () => {
          const deleteModalBackdrop = document.getElementById("deleteModalBackdrop");
          const cancelDeleteBtn = document.getElementById("cancelDeleteBtn");
          const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");

          deleteModalBackdrop.classList.add("open");

          cancelDeleteBtn.onclick = () => {
            deleteModalBackdrop.classList.remove("open");
          };

          confirmDeleteBtn.onclick = async () => {
            deleteModalBackdrop.classList.remove("open");
            confirmDeleteBtn.disabled = true;

            try {
              const { error } = await supabaseClient
                .from("ads")
                .delete()
                .eq("id", ad.id);

              if (error) throw error;

              window.location.href = "seller-dashboard.html?tab=my-ads";
            } catch (error) {
              console.error("Delete error:", error);
              alert("Failed to delete ad");
              confirmDeleteBtn.disabled = false;
            }
          };
        });
      }
    }

  }


  /* =========================================
     START
  ========================================= */

  loadAd();

</script>

</body>
</html>
