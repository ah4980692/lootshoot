<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat - LootShoot</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
  rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

  :root {
    --primary: #0c4b32;
    --primary-hover: #08603c;
    --accent: #25a56a;
    --accent-dark: #1c9560;
    --bg: #f4faf6;
    --text: #123c2a;
    --muted: #718078;
    --muted-2: #7b8982;
    --border: #d8e7de;
    --border-2: #e7eee9;
    --light-green: #d9f5e5;
    --light-green-2: #eef9f2;
    --red: #a83232;
    --red-bg: #f8e5e5;
    --red-bg-2: #fce0e0;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  button,
  input,
  textarea {
    font-family: inherit;
  }

  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .app-shell {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }

  @media (min-width: 600px) {

    .app-shell {
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

  }

  @media (min-width: 900px) {

    body {
      padding: 28px;
      background: #edf3f7;
    }

    .app-shell {
      max-width: 1200px;
      width: min(1200px, calc(100vw - 100px));
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(23, 34, 48, 0.12);
    }

  }

  /* Header */

  .chat-header {
    background: var(--primary);
    color: white;
    padding: 18px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-width: 0;
  }

  .back-button {
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    padding: 0;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease;
  }

  .back-button:hover {
    opacity: 0.8;
  }

  .header-title {
    font-size: 18px;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .header-subtitle {
    font-size: 12px;
    opacity: 0.85;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-icon-btn {
    background: rgba(255, 255, 255, 0.15);
    border: none;
    color: white;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .header-icon-btn:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: translateY(-1px);
  }

  .header-icon-btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Chat Container */

  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .chat-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }

  .chat-empty-icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.6;
  }

  .chat-empty-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }

  .chat-empty-text {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
  }

  .message-bubble {
    display: flex;
    margin-bottom: 8px;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .message-bubble.sent {
    justify-content: flex-end;
  }

  .message-bubble.received {
    justify-content: flex-start;
  }

  .message-content {
    max-width: 70%;
    padding: 12px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    word-break: break-word;
  }

  .message-bubble.sent .message-content {
    background: var(--accent);
    color: white;
  }

  .message-bubble.received .message-content {
    background: var(--light-green-2);
    color: var(--text);
  }

  .message-time {
    font-size: 11px;
    color: var(--muted-2);
    margin-top: 4px;
    text-align: center;
    margin-bottom: 12px;
  }

  /* Chat Input Area */

  .chat-input-area {
    background: white;
    padding: 12px 16px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    border-top: 1px solid var(--border-2);
  }

  .message-input-wrapper {
    flex: 1;
    display: flex;
    gap: 8px;
    background: var(--light-green-2);
    border-radius: 20px;
    padding: 0 14px;
    align-items: center;
  }

  .message-input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 10px 0;
    font-size: 14px;
    color: var(--text);
    resize: none;
    max-height: 100px;
    outline: none;
  }

  .message-input::placeholder {
    color: var(--muted);
  }

  .input-action-btn {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 18px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease;
  }

  .input-action-btn:hover {
    opacity: 0.8;
  }

  .send-button {
    background: var(--accent);
    border: none;
    color: white;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, transform 0.2s ease;
    flex-shrink: 0;
  }

  .send-button:hover {
    background: var(--accent-dark);
    transform: translateY(-1px);
  }

  .send-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .send-button svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Auth Message */

  .auth-message {
    background: white;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    margin: auto;
    width: min(100%, 380px);
  }

  .auth-message-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 10px;
    color: var(--text);
  }

  .auth-message-text {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 20px;
    line-height: 1.6;
  }

  .auth-message-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .auth-message-btn {
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s ease;
  }

  .auth-message-btn.secondary {
    background: var(--light-green-2);
    color: var(--primary);
    border: 1px solid var(--accent);
  }

  .auth-message-btn.secondary:hover {
    background: var(--light-green);
  }

  .auth-message-btn.primary {
    background: var(--primary);
    color: white;
  }

  .auth-message-btn.primary:hover {
    background: var(--primary-hover);
  }

  @media (max-width: 600px) {

    .chat-header {
      padding: 15px;
    }

    .header-left {
      gap: 10px;
    }

    .header-title {
      font-size: 16px;
    }

    .header-subtitle {
      font-size: 11px;
    }

    .message-content {
      max-width: 85%;
      font-size: 13px;
    }

    .chat-input-area {
      padding: 10px 14px 14px;
    }

  }

</style>
</head>
<body>

<div class="app-shell">

  <header class="chat-header">

    <div class="header-left">
      <button type="button" class="back-button" id="backButton" aria-label="Go back" title="Back">←</button>
      <div>
        <div class="header-title" id="chatTitle">Chat</div>
        <div class="header-subtitle" id="chatSubtitle">LootShoot</div>
      </div>
    </div>

    <div class="header-right">
      <button type="button" class="header-icon-btn" id="moreOptionsBtn" aria-label="More options" title="More options">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="5" r="2"></circle>
          <circle cx="12" cy="12" r="2"></circle>
          <circle cx="12" cy="19" r="2"></circle>
        </svg>
      </button>
    </div>

  </header>

  <div class="chat-container" id="chatContainer">
    <div class="chat-empty">
      <div class="chat-empty-icon">💬</div>
      <div class="chat-empty-title">No messages yet</div>
      <div class="chat-empty-text">Chat feature coming soon. Messages will appear here.</div>
    </div>
  </div>

  <div class="chat-input-area" id="chatInputArea" style="display: none;">
    <div class="message-input-wrapper">
      <input
        type="text"
        class="message-input"
        id="messageInput"
        placeholder="Type a message..."
        aria-label="Message input"
      >
      <button type="button" class="input-action-btn" id="attachBtn" aria-label="Attach file" title="Attach">📎</button>
    </div>
    <button type="button" class="send-button" id="sendButton" aria-label="Send message" title="Send" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 12l18-9-18 9m0 0v6l6-3-6-3z"></path>
      </svg>
    </button>
  </div>

</div>

<script>

  /* =========================================================
     SUPABASE
  ========================================================= */

  const supabaseUrl =
    "https://saguwhkijrdiwiabxvyv.supabase.co";

  const supabaseKey =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhZ3V3aGtpanJkaXdpYWJ4dnl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMTQ1ODEsImV4cCI6MjEwNDY5MDU4MX0.onEJePT4-Ijz-O9R8E3RRoFVaqwY1mIez-F9Xy0xUbQ";

  const supabaseClient =
    window.supabase.createClient(supabaseUrl, supabaseKey);


  /* =========================================================
     GET AUTHENTICATED USER
  ========================================================= */

  async function getAuthenticatedUser() {

    try {

      let { data: sessionData, error: sessionError } =
        await supabaseClient.auth.getSession();

      if (sessionError) {
        console.warn("getSession error:", sessionError);
      }

      if (!sessionData?.session) {

        const storedSession =
          sessionStorage.getItem("sellerAuthSession") ||
          localStorage.getItem("sellerAuthSession");

        if (storedSession) {

          try {

            const parsedSession = JSON.parse(storedSession);

            const { data, error } =
              await supabaseClient.auth.setSession(parsedSession);

            if (error) {
              throw error;
            }

            sessionData = data;

            if (data?.session) {
              sessionStorage.setItem("sellerAuthSession", JSON.stringify(data.session));
            }

          } catch (parseError) {
            console.warn("Could not parse stored session:", parseError);
            return null;
          }

        }

      }

      return sessionData?.session?.user || null;

    } catch (error) {

      console.error("Could not get authenticated user:", error);
      return null;

    }

  }


  /* =========================================================
     NAVIGATION
  ========================================================= */

  document.getElementById("backButton").addEventListener("click", () => {
    window.location.href = "seller-dashboard.html";
  });


  /* =========================================================
     INITIALIZATION
  ========================================================= */

  async function initializeChat() {

    const chatContainer = document.getElementById("chatContainer");
    const chatInputArea = document.getElementById("chatInputArea");
    const authMessage = document.querySelector(".auth-message");

    try {

      const user = await getAuthenticatedUser();

      if (!user) {

        // Show auth required message
        chatContainer.innerHTML = `
          <div class="auth-message" style="margin: auto;">
            <div class="auth-message-title">Sign In Required</div>
            <div class="auth-message-text">You must sign in to access the chat feature.</div>
            <div class="auth-message-buttons">
              <button type="button" class="auth-message-btn secondary" onclick="window.location.href='index.html';">Sign Up</button>
              <button type="button" class="auth-message-btn primary" onclick="window.location.href='index.html';">Sign In</button>
            </div>
          </div>
        `;

        chatInputArea.style.display = "none";
        return;

      }

      // User is authenticated
      // Chat input area will be shown when chat feature is fully implemented
      chatInputArea.style.display = "none";

      // Show placeholder for now
      if (chatContainer.querySelector(".chat-empty")) {
        // Keep the default empty state
      }

    } catch (error) {

      console.error("Could not initialize chat:", error);
      chatContainer.innerHTML = `
        <div class="chat-empty">
          <div class="chat-empty-icon">⚠️</div>
          <div class="chat-empty-title">Something went wrong</div>
          <div class="chat-empty-text">Please try refreshing the page.</div>
        </div>
      `;

    }

  }

  // Initialize on page load
  window.addEventListener("load", initializeChat);
  
  // Also initialize immediately in case page is already loaded
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initializeChat);
  } else {
    initializeChat();
  }


  /* =========================================================
     MESSAGE INPUT
  ========================================================= */

  const messageInput = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");

  messageInput.addEventListener("input", () => {
    sendButton.disabled = !messageInput.value.trim();
  });

  messageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !sendButton.disabled) {
      e.preventDefault();
      sendButton.click();
    }
  });

  sendButton.addEventListener("click", async () => {
    const message = messageInput.value.trim();

    if (!message) {
      return;
    }

    // TODO: Implement actual message sending when chat backend is ready

    messageInput.value = "";
    sendButton.disabled = true;
  });

</script>

</body>
</html>
