<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat - LootShoot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--primary:#0c4b32;--primary-hover:#08603c;--accent:#25a56a;--bg:#f4faf6;--text:#123c2a;--muted:#718078;--muted-2:#7b8982;--border:#d8e7de;--border-2:#e7eee9;--light-green:#d9f5e5;--light-green-2:#eef9f2;--red:#a83232;--red-bg:#f8e5e5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.message-input:focus-visible,.message-input:focus{outline:none;outline-offset:0;box-shadow:none}
.app-shell{max-width:480px;margin:0 auto;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column}
@media(min-width:600px){.app-shell{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
@media(min-width:900px){body{padding:28px;background:#edf3f7}.app-shell{max-width:1200px;width:min(1200px,calc(100vw - 100px));height:calc(100vh - 56px);border-radius:30px;overflow:hidden;box-shadow:0 24px 60px rgba(23,34,48,.12)}}

/* Header */
.chat-header{background:var(--primary);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.1)}
.header-left{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.header-left>div{min-width:0}
.header-avatar{display:none;width:38px;height:38px;border-radius:50%;background:var(--light-green);color:var(--primary);align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;text-transform:uppercase;user-select:none}
.back-button{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:opacity .2s}
.back-button:hover{opacity:.8}
.header-title{font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-subtitle{font-size:12px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-right{display:flex;align-items:center;gap:10px}
.conversation-return-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:background .2s,transform .2s}
.conversation-return-btn:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
.header-icon-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s}
.header-icon-btn:hover{background:rgba(255,255,255,.25);transform:translateY(-1px)}
.header-icon-btn svg{width:18px;height:18px;fill:currentColor}

/* Ad strip (shown under header inside a conversation) */
.ad-strip{display:none;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--border-2);text-decoration:none;color:inherit;cursor:pointer;flex-shrink:0;transition:background .15s}
.ad-strip:hover{background:var(--light-green-2)}
.ad-strip-thumb{width:52px;height:52px;border-radius:10px;background:var(--light-green-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.ad-strip-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ad-strip-thumb svg{width:22px;height:22px;stroke:var(--muted-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ad-strip-info{flex:1;min-width:0}
.ad-strip-title{font-size:14px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ad-strip-price{font-size:13px;font-weight:600;color:var(--primary);margin-top:2px}
.ad-strip-chevron{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* Chat container */
.chat-container{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.chat-empty,.conversation-thread-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.chat-empty-icon{font-size:48px;margin-bottom:16px;opacity:.6}
.chat-empty-title{font-size:18px;font-weight:700;margin-bottom:8px}
.chat-empty-text{font-size:14px;color:var(--muted);line-height:1.5}

/* Conversation panel */
.conversation-panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.conversation-thread{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 2px}

/* Messages */
.message-bubble{display:flex;animation:slideIn .25s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.message-bubble.sent{justify-content:flex-end}
.message-bubble.received{justify-content:flex-start}
.message-content{max-width:78%;padding:8px 12px 18px;border-radius:14px;font-size:14px;line-height:1.45;word-break:break-word;white-space:pre-wrap;display:flex;align-items:flex-end;justify-content:flex-start;gap:6px;position:relative}
.message-bubble.sent .message-content{background:#d9f5e5;color:var(--text);border:1px solid #b9e3cd;border-bottom-right-radius:4px}
.message-bubble.received .message-content{background:#fff;color:var(--text);border:1px solid var(--border);border-bottom-left-radius:4px}
.message-text{flex:1 1 auto;min-width:0;white-space:pre-wrap;word-break:break-word}
.message-meta{display:inline-flex;align-items:flex-end;gap:2px;flex-shrink:0;line-height:1;margin-left:6px;transform:translateY(2px)}
.message-time{font-size:10px;line-height:1.2;text-align:right;color:var(--muted);opacity:.9}
.message-status{display:inline-block;font-size:10px;line-height:1;letter-spacing:-.02em;transform:translateY(1px)}
.message-status.pending,.message-status.delivered{color:var(--muted)}
.message-status.read{color:var(--accent);font-weight:700}

/* Image messages */
.message-content.image-message{display:block;padding:4px;line-height:0}
.chat-image-wrap{position:relative;display:block;line-height:0;border-radius:11px;overflow:hidden;background:var(--light-green-2);min-width:160px;min-height:120px}
.chat-image{display:block;width:260px;max-width:100%;max-height:320px;object-fit:cover;cursor:zoom-in}
.chat-image-wrap.is-broken .chat-image{display:none}
.chat-image-wrap.is-broken::after{content:"Image unavailable";display:flex;align-items:center;justify-content:center;width:200px;max-width:100%;height:120px;font-size:12px;line-height:1.4;color:var(--muted)}
.message-content.image-message .message-meta{position:absolute;right:10px;bottom:10px;margin:0;transform:none;gap:3px;padding:3px 7px;border-radius:999px;background:rgba(0,0,0,.45)}
.message-content.image-message .message-time,
.message-content.image-message .message-status.pending,
.message-content.image-message .message-status.delivered{color:#fff;opacity:1}
.message-content.image-message .message-status.read{color:#7ef0b3}

/* Pending image preview (sits above the input row) */
.pending-image{display:flex;align-items:center;gap:12px;padding:8px;background:var(--light-green-2);border:1px solid var(--border);border-radius:14px}
.pending-image-thumb{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#fff;border:1px solid var(--border)}
.pending-image-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pending-image-spinner{display:none;position:absolute;inset:0;background:rgba(255,255,255,.7);align-items:center;justify-content:center}
.pending-image-spinner::after{content:"";width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pending-image.is-uploading .pending-image-spinner{display:flex}
.pending-image-info{flex:1;min-width:0}
.pending-image-name{font-size:13px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pending-image-meta{font-size:12px;color:var(--muted);margin-top:2px}
.pending-image-remove{width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--border);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;transition:background .15s,color .15s}
.pending-image-remove:hover{background:var(--red-bg);color:var(--red)}
.pending-image-remove svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.pending-image.is-uploading .pending-image-remove{display:none}

/* Full-size image viewer */
.lightbox{position:fixed;inset:0;z-index:1000;background:rgba(8,20,14,.92);display:none;align-items:center;justify-content:center;padding:24px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain}
.lightbox-close{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.lightbox-close:hover{background:rgba(255,255,255,.28)}
.lightbox-close svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

/* Input area */
.chat-input-area{background:#fff;padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border-2);flex-shrink:0}
.chat-input-row{display:flex;gap:10px;align-items:center}
.message-input-wrapper{flex:1;display:flex;gap:8px;background:var(--light-green-2);border-radius:24px;padding:0 14px;align-items:center;min-height:44px}
.message-input{flex:1;border:none;background:transparent;padding:10px 0;font-size:15px;color:var(--text);outline:none;min-width:0}
.message-input::placeholder{color:var(--muted)}
.input-action-btn{background:none;border:none;cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center}
.input-action-btn svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.input-action-btn:hover svg{stroke:var(--accent)}
.input-action-btn:disabled{opacity:.4;cursor:not-allowed}

/* Send button (WhatsApp-style) */
.send-button{background:var(--accent);border:none;color:#fff;width:46px;height:46px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s;flex-shrink:0;padding:0}
.send-button:hover{background:#1c9560;transform:scale(1.05)}
.send-button:active{transform:scale(.95)}
.send-button:disabled{background:#dfe6e1;color:#7a8a81;cursor:not-allowed;transform:none}
.send-button svg{width:22px;height:22px;fill:currentColor;stroke:none;display:block;margin-left:2px}

/* Auth */
.auth-message{background:#fff;padding:30px;border-radius:15px;text-align:center;margin:auto;width:min(100%,380px)}
.auth-message-title{font-size:20px;font-weight:700;margin-bottom:10px}
.auth-message-text{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.6}
.auth-message-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.auth-message-btn{padding:12px;border-radius:10px;border:none;font-weight:700;font-size:14px;cursor:pointer;transition:.2s}
.auth-message-btn.secondary{background:var(--light-green-2);color:var(--primary);border:1px solid var(--accent)}
.auth-message-btn.secondary:hover{background:var(--light-green)}
.auth-message-btn.primary{background:var(--primary);color:#fff}
.auth-message-btn.primary:hover{background:var(--primary-hover)}

/* Tabs & list */
.chat-tabs{display:flex;gap:10px;background:var(--light-green-2);border:1px solid var(--border-2);border-radius:16px;padding:8px;position:sticky;top:0;z-index:1}
.chat-tab{flex:1;border:1px solid transparent;background:transparent;color:var(--muted);padding:12px 14px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.chat-tab.active{background:#fff;color:var(--primary);box-shadow:0 4px 12px rgba(12,75,50,.08);border-color:var(--border)}
.chat-list{display:flex;flex-direction:column;gap:10px}
.conversation-item{width:100%;background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px 18px;text-align:left;cursor:pointer;transition:transform .15s,box-shadow .15s;color:inherit}
.conversation-item:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(18,60,42,.06)}
.conversation-item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.conversation-item-title{font-size:15px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conversation-item-time{font-size:12px;color:var(--muted-2);white-space:nowrap}
.conversation-unread-badge{background:var(--accent);color:#fff;font-size:12px;line-height:1;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;margin-left:8px}
.conversation-item-meta{font-size:12px;color:var(--muted);margin-bottom:6px}
.conversation-item-preview{font-size:13px;color:var(--muted);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chat-error{background:var(--red-bg);border:1px solid #e9b7b7;color:var(--red);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.5}
.chat-loading{flex:1;display:flex;align-items:center;justify-content:center;min-height:180px;color:var(--muted);font-size:14px;font-weight:600}

@media(max-width:600px){
.chat-header{padding:15px}
.header-title{font-size:16px}
.header-subtitle{font-size:11px}
.message-content{max-width:85%;font-size:14px}
.chat-input-area{padding:10px 14px 14px}
.conversation-item{padding:14px 16px}
.conversation-item-title{font-size:14px}
}
</style>
</head>
<body>

<div class="app-shell">

  <header class="chat-header">
    <div class="header-left">
      <button type="button" class="back-button" id="backButton" aria-label="Go back" title="Back">←</button>
      <div class="header-avatar" id="chatAvatar" aria-hidden="true"></div>
      <div>
        <div class="header-title" id="chatTitle">Chat</div>
        <div class="header-subtitle" id="chatSubtitle">LootShoot</div>
      </div>
    </div>
    <div class="header-right">
      <button type="button" class="header-icon-btn" id="moreOptionsBtn" aria-label="More options" title="More options">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </div>
  </header>

  <a class="ad-strip" id="adStrip" href="#" aria-label="Open ad">
    <div class="ad-strip-thumb" id="adStripThumb">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    </div>
    <div class="ad-strip-info">
      <div class="ad-strip-title" id="adStripTitle">Ad title</div>
      <div class="ad-strip-price" id="adStripPrice">Rs 0</div>
    </div>
    <svg class="ad-strip-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </a>

  <div class="chat-container" id="chatContainer">
    <div class="chat-loading">Loading...</div>
  </div>

  <div class="chat-input-area" id="chatInputArea" style="display:none;">
    <div class="pending-image" id="pendingImagePreview" style="display:none;">
      <div class="pending-image-thumb">
        <img id="previewImage" alt="Selected image">
        <div class="pending-image-spinner" aria-hidden="true"></div>
      </div>
      <div class="pending-image-info">
        <div class="pending-image-name" id="pendingImageName"></div>
        <div class="pending-image-meta" id="pendingImageMeta"></div>
      </div>
      <button type="button" class="pending-image-remove" id="clearImageBtn" aria-label="Remove image" title="Remove image">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="chat-input-row">
      <div class="message-input-wrapper">
        <input type="text" class="message-input" id="messageInput" placeholder="Type a message" aria-label="Message input" autocomplete="off">
        <button type="button" class="input-action-btn" id="attachBtn" aria-label="Attach image" title="Attach image">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp" style="display:none;" aria-hidden="true">
      </div>
      <button type="button" class="send-button" id="sendButton" aria-label="Send message" title="Send" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M1.101 21.757L23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z"/></svg>
      </button>
    </div>
  </div>

</div>

<div class="lightbox" id="imageLightbox" role="dialog" aria-modal="true" aria-label="Image preview">
  <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close" title="Close">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <img id="lightboxImg" alt="Chat image">
</div>

<script>
const supabaseUrl = "https://saguwhkijrdiwiabxvyv.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhZ3V3aGtpanJkaXdpYWJ4dnl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMTQ1ODEsImV4cCI6MjEwNDY5MDU4MX0.onEJePT4-Ijz-O9R8E3RRoFVaqwY1mIez-F9Xy0xUbQ";
const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

const TABS = { buying: "buying", selling: "selling" };
let currentTab = TABS.buying;
let conversationsCache = { buying: [], selling: [] };
let currentConversationId = null;
let isConversationViewOpen = false;
let currentThreadMessages = [];
let isSendingMessage = false;
let currentUserId = null;
let activeChannel = null;
let pendingImage = null;
let isUploadingImage = false;

const $ = (id) => document.getElementById(id);

// Prevents HTML injection from user-generated text
function esc(str) {
  const d = document.createElement("div");
  d.textContent = str ?? "";
  // also escape quotes so the result is safe inside attributes (src="...", data-id="...")
  return d.innerHTML.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* ---------- Realtime ---------- */

function removeConversationSubscription() {
  if (activeChannel) {
    supabaseClient.removeChannel(activeChannel);
    activeChannel = null;
  }
}

function subscribeToConversationMessages(conversationId) {
  if (!conversationId) return;
  removeConversationSubscription();

  activeChannel = supabaseClient.channel(`chat-conversation-${conversationId}`);
  activeChannel
    .on("postgres_changes", {
      event: "INSERT", schema: "public", table: "messages",
      filter: `conversation_id=eq.${conversationId}`
    }, async (payload) => {
      const msg = payload?.new;
      if (msg && msg.conversation_id === conversationId) {
        if (msg.sender_id !== currentUserId) {
          const updatedMsg = await markIncomingMessageStatus(msg);
          addMessage(updatedMsg);
          return;
        }
        addMessage(msg);
      }
    })
    .on("postgres_changes", {
      event: "UPDATE", schema: "public", table: "messages",
      filter: `conversation_id=eq.${conversationId}`
    }, (payload) => {
      const msg = payload?.new;
      if (!msg || msg.conversation_id !== conversationId) return;

      // Keep the local thread state in sync
      const existingIndex = currentThreadMessages.findIndex((m) => m && m.id === msg.id);
      if (existingIndex >= 0) currentThreadMessages[existingIndex] = msg;

      // Update only the meta (time + tick) inside the visible bubble to avoid
      // re-rendering the whole message or duplicating nodes.
      const bubble = document.querySelector(`.message-bubble[data-id="${String(msg.id)}"]`);
      if (bubble) {
        const meta = bubble.querySelector('.message-meta');
        if (meta) {
          meta.innerHTML = `<span class="message-time">${esc(formatMessageTime(msg.created_at))}</span>${getMessageStatusMarkup(msg)}`;
        } else {
          // Fallback: replace whole bubble if structure differs
          bubble.outerHTML = messageHtml(msg);
        }
      }
    })
    .subscribe((status) => {
      if (status !== "SUBSCRIBED") console.warn("Realtime status:", status);
    });
}

/* ---------- Message rendering (single path, no duplicates) ---------- */

function getMessageStatusMarkup(message) {
  if (!message || message.sender_id !== currentUserId) return "";
  if (message.is_read === true) return '<span class="message-status read">✓✓</span>';
  if (message.delivered_at) return '<span class="message-status delivered">✓✓</span>';
  return '<span class="message-status pending">✓</span>';
}

const CHAT_IMAGE_PREFIX = "CHAT_IMAGE:";
const CHAT_IMAGE_BASE = `${supabaseUrl}/storage/v1/object/public/chat-images/`;

// Only accept images that live in our own chat-images bucket
function getChatImageUrl(text) {
  if (typeof text !== "string" || !text.startsWith(CHAT_IMAGE_PREFIX)) return null;
  const url = text.slice(CHAT_IMAGE_PREFIX.length).trim();
  return url.startsWith(CHAT_IMAGE_BASE) ? url : null;
}

// Text shown in the chat list instead of the raw "CHAT_IMAGE:https://..." string
function getMessagePreviewText(text) {
  return getChatImageUrl(text) ? "📷 Photo" : (text || "");
}

function messageHtml(m) {
  const out = m.sender_id === currentUserId;
  const statusMarkup = getMessageStatusMarkup(m);
  const metaMarkup = `<div class="message-meta"><span class="message-time">${esc(formatMessageTime(m.created_at))}</span>${statusMarkup}</div>`;

  const imageUrl = getChatImageUrl(m.message);
  const contentHtml = imageUrl
    ? `<span class="chat-image-wrap"><img class="chat-image" src="${esc(imageUrl)}" alt="Photo" decoding="async"></span>`
    : `<div class="message-text">${esc(m.message)}</div>`;

  return `<div class="message-bubble ${out ? "sent" : "received"}" data-id="${esc(String(m.id))}">
    <div class="message-content${imageUrl ? " image-message" : ""}">
      ${contentHtml}
      ${metaMarkup}
    </div>
  </div>`;
}

async function markIncomingMessageStatus(message) {
  if (!message || !message.id || !currentConversationId || !currentUserId || message.sender_id === currentUserId) return message;

  const nextDeliveredAt = message.delivered_at || new Date().toISOString();

  try {
    const { data, error } = await supabaseClient
      .from("messages")
      .update({ delivered_at: nextDeliveredAt, is_read: true })
      .eq("id", message.id)
      .eq("conversation_id", currentConversationId)
      .neq("sender_id", currentUserId)
      .select("id, conversation_id, sender_id, message, created_at, delivered_at, is_read")
      .single();

    if (error) {
      console.warn("Could not update incoming message status:", error);
      return message;
    }

    return data || { ...message, delivered_at: nextDeliveredAt, is_read: true };
  } catch (e) {
    console.warn("Could not update incoming message status:", e);
    return message;
  }
}

async function markConversationMessagesRead() {
  if (!currentConversationId || !currentUserId) return [];

  const pendingIncoming = (currentThreadMessages || []).filter((msg) => msg && msg.sender_id !== currentUserId);
  if (!pendingIncoming.length) return [];

  const updated = [];
  for (const msg of pendingIncoming) {
    updated.push(await markIncomingMessageStatus(msg));
  }
  return updated;
}

function addMessage(message) {
  if (!message || !message.id) return;
  if (currentThreadMessages.some((m) => m.id === message.id)) return;

  const thread = document.querySelector(".conversation-thread");
  if (!thread) return;

  thread.querySelector(".conversation-thread-empty")?.remove();
  thread.insertAdjacentHTML("beforeend", messageHtml(message));
  currentThreadMessages.push(message);
  thread.scrollTop = thread.scrollHeight;
}

/* ---------- UI helpers ---------- */

function getInitials(name) {
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return "?";
  const first = Array.from(parts[0])[0] || "";
  const second = parts.length > 1 ? (Array.from(parts[parts.length - 1])[0] || "") : "";
  return (first + second) || "?";
}

// withAvatar = true (conversation view): avatar + name only, no subtitle
function setHeaderText(title, subtitle, withAvatar = false, avatarUrl = null) {
  $("chatTitle").textContent = title || "Chat";
  $("chatSubtitle").textContent = subtitle || "LootShoot";
  $("chatSubtitle").style.display = withAvatar ? "none" : "";
  const avatar = $("chatAvatar");
  avatar.style.display = withAvatar ? "flex" : "none";
  
  if (withAvatar) {
    if (avatarUrl) {
      avatar.innerHTML = `<img src="${esc(avatarUrl)}" alt="${esc(title)}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
    } else {
      avatar.textContent = getInitials(title);
    }
  } else {
    avatar.textContent = "";
  }
}

// Ad strip under the header. Pass { title, price, image, url } to fill it in;
// anything omitted falls back to the placeholder.
function setAdStrip(show, ad = {}) {
  const strip = $("adStrip");
  strip.style.display = show ? "flex" : "none";
  if (!show) return;

  $("adStripTitle").textContent = ad.title || "Ad title";
  $("adStripPrice").textContent = ad.price || "Rs 0";
  strip.setAttribute("href", ad.url || "#");

  const thumb = $("adStripThumb");
  if (ad.image) {
    thumb.innerHTML = `<img src="${esc(ad.image)}" alt="">`;
  } else {
    thumb.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';
  }
}

function refreshComposerState() {
  const hasText = $("messageInput").value.trim().length > 0;
  $("sendButton").disabled = !isConversationViewOpen || isSendingMessage || isUploadingImage || (!hasText && !pendingImage);
}

function hideComposer() {
  $("chatInputArea").style.display = "none";
  $("messageInput").value = "";
  $("sendButton").disabled = true;
}

function resetListState() {
  setHeaderText("Chat", "LootShoot");
  setAdStrip(false);
  clearPendingImage();
  isConversationViewOpen = false;
  currentConversationId = null;
  currentThreadMessages = [];
  hideComposer();
}

function goToConversationList() {
  removeConversationSubscription();
  const url = new URL(window.location.href);
  url.searchParams.delete("conversation_id");
  window.history.replaceState({}, "", url.toString());
  resetListState();
  // Clear cached conversations so unread counts refresh after viewing a thread
  conversationsCache[currentTab] = [];
  showTab(currentTab);
}

function getConversationIdFromUrl() {
  return new URLSearchParams(window.location.search).get("conversation_id");
}

function formatMessageTime(iso) {
  if (!iso) return "";
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return "";
  const diffDays = Math.floor((new Date() - date) / 86400000);
  if (diffDays === 0) return date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  if (diffDays < 7) return date.toLocaleDateString([], { weekday: "short" });
  return date.toLocaleDateString([], { month: "short", day: "numeric" });
}

function tabMarkup(selected = currentTab) {
  return `<div class="chat-tabs" aria-label="Chat tabs">
    <button type="button" class="chat-tab ${selected === TABS.buying ? "active" : ""}" data-tab="buying">Buying</button>
    <button type="button" class="chat-tab ${selected === TABS.selling ? "active" : ""}" data-tab="selling">Selling</button>
  </div>`;
}

function bindTabEvents() {
  $("chatContainer").querySelectorAll(".chat-tab").forEach((btn) => {
    btn.addEventListener("click", () => {
      const t = btn.dataset.tab;
      if (!t || t === currentTab) return;
      currentTab = t;
      showTab(currentTab);
    });
  });
}

function renderLoadingState() {
  resetListState();
  $("chatContainer").innerHTML = `${tabMarkup()}<div class="chat-loading">Loading conversations...</div>`;
  bindTabEvents();
}

function renderErrorState(message) {
  resetListState();
  $("chatContainer").innerHTML = `${tabMarkup()}<div class="chat-error">${esc(message)}</div>`;
  bindTabEvents();
}

function renderEmptyState(tabName) {
  resetListState();
  const text = tabName === TABS.buying ? "No buying conversations yet" : "No selling conversations yet";
  $("chatContainer").innerHTML = `${tabMarkup(tabName)}
    <div class="chat-empty">
      <div class="chat-empty-icon">💬</div>
      <div class="chat-empty-title">${text}</div>
      <div class="chat-empty-text">Your conversations will appear here.</div>
    </div>`;
  bindTabEvents();
}

function renderConversationList(conversations) {
  resetListState();
  if (!conversations || !conversations.length) {
    renderEmptyState(currentTab);
    return;
  }

  const listHtml = conversations.map((c) => {
    const name = c.otherParticipantName || (currentTab === TABS.buying ? "Seller" : "Buyer");
    const preview = getMessagePreviewText(c.latestMessage?.message) || "No messages yet";
    const ts = c.latestMessage?.created_at || c.created_at;
    const unread = Number(c.unreadCount || 0) || 0;
    const badge = unread > 0 ? `<span class="conversation-unread-badge">${esc(unread > 99 ? '99+' : String(unread))}</span>` : "";
    return `<button type="button" class="conversation-item" data-conversation-id="${esc(String(c.id))}" aria-label="Open conversation with ${esc(name)}">
      <div class="conversation-item-top">
        <div class="conversation-item-title">${esc(c.adTitle || "Ad")}</div>
        <div class="conversation-item-time">${esc(ts ? formatMessageTime(ts) : "")}${badge}</div>
      </div>
      <div class="conversation-item-meta">${esc(name)}</div>
      <div class="conversation-item-preview">${esc(preview)}</div>
    </button>`;
  }).join("");

  $("chatContainer").innerHTML = `${tabMarkup(currentTab)}<div class="chat-list">${listHtml}</div>`;
  bindTabEvents();

  // Ensure unread badges are refreshed even when using cached conversation lists
  // so badges appear without requiring a full page refresh.
  document.querySelectorAll('.conversation-item').forEach((item) => {
    const id = item.dataset.conversationId;
    if (id) refreshConversationUnreadBadge(id);
  });

  // Update global unread badge (for other pages like seller dashboard)
  const totalUnread = (conversations || []).reduce((s, c) => s + (Number(c.unreadCount || 0) || 0), 0);
  updateGlobalUnreadBadge(totalUnread);

  $("chatContainer").querySelectorAll(".conversation-item").forEach((item) => {
    item.addEventListener("click", () => {
      const id = item.dataset.conversationId;
      if (!id) return;
      const url = new URL(window.location.href);
      url.searchParams.set("conversation_id", id);
      window.history.replaceState({}, "", url.toString());
      renderConversationThread(id);
    });
  });
}

async function refreshConversationUnreadBadge(conversationId) {
  if (!conversationId) return;
  try {
    // Ensure we have currentUserId; fall back to auth if missing
    if (!currentUserId) {
      const u = await getAuthenticatedUser();
      if (!u) return;
      currentUserId = u.id;
    }

    const { count, error } = await supabaseClient
      .from('messages')
      .select('id', { count: 'exact' })
      .eq('conversation_id', conversationId)
      .neq('sender_id', currentUserId)
      .eq('is_read', false);

    if (error) return;
    const unread = Number(count || 0);

    const item = document.querySelector(`.conversation-item[data-conversation-id="${escapeSelector(conversationId)}"]`);
    if (!item) return;

    const timeNode = item.querySelector('.conversation-item-time');
    if (!timeNode) return;

    const existing = timeNode.querySelector('.conversation-unread-badge');
    if (unread > 0) {
      const text = unread > 99 ? '99+' : String(unread);
      if (existing) {
        existing.textContent = text;
      } else {
        const span = document.createElement('span');
        span.className = 'conversation-unread-badge';
        span.textContent = text;
        timeNode.appendChild(span);
      }
    } else if (existing) {
      existing.remove();
    }
    // Recompute total unread across rendered list and publish globally
    const total = Array.from(document.querySelectorAll('.conversation-unread-badge')).reduce((s, el) => {
      const n = parseInt(el.textContent || '0', 10);
      return s + (Number.isFinite(n) ? n : 0);
    }, 0);
    updateGlobalUnreadBadge(total);
  } catch (e) {
    console.warn('Could not refresh unread badge:', e);
  }
}

function escapeSelector(s) {
  return String(s).replace(/(["'\\.:#\[\],<>+~*=^$|(){}])/g, "\\$1");
}

function updateGlobalUnreadBadge(total) {
  try { localStorage.setItem('lootshoot_chat_unread', String(total)); } catch (e) { }
  try {
    const bc = new BroadcastChannel('lootshoot-chat');
    bc.postMessage({ unread: total });
    bc.close();
  } catch (e) { }
  try { window.dispatchEvent(new CustomEvent('lootshoot-chat-unread', { detail: { unread: total } })); } catch (e) { }

  // If a global badge element exists on this page, update it immediately.
  const globalEl = document.querySelector('#globalChatBadge, .global-chat-badge');
  if (globalEl) {
    if (total > 0) globalEl.textContent = total > 99 ? '99+' : String(total);
    else globalEl.remove();
  }
}

/* ---------- Data ---------- */

async function getAdDetails(adId) {
  if (!adId) return { title: "Ad", price: "Rs 0", image: null, id: null };
  try {
    const { data, error } = await supabaseClient.from("ads").select("id, title, price, images").eq("id", adId).maybeSingle();
    if (error) { console.warn("Could not load ad details:", error); return { title: "Ad", price: "Rs 0", image: null, id: null }; }
    return {
      title: data?.title || "Ad",
      price: data?.price ? `Rs ${data.price}` : "Rs 0",
      image: data?.images || null,
      id: data?.id || null
    };
  } catch (e) {
    console.warn("Could not load ad details:", e);
    return { title: "Ad", price: "Rs 0", image: null, id: null };
  }
}

async function getSellerProfile(userId) {
  if (!userId) return null;
  try {
    const { data, error } = await supabaseClient.from("sellers").select("id, username, avatar_url").eq("id", userId).maybeSingle();
    if (error) { console.warn("Could not load profile:", error); return null; }
    return data;
  } catch (e) {
    console.warn("Could not load profile:", e);
    return null;
  }
}

async function getOtherParticipantName(conversation) {
  const fallback = currentTab === TABS.buying ? "Seller" : "Buyer";
  const targetId = currentTab === TABS.buying ? conversation.seller_id : conversation.buyer_id;
  if (!targetId) return fallback;
  const profile = await getSellerProfile(targetId);
  return profile?.username || fallback;
}

async function getLatestMessage(conversationId) {
  try {
    const { data, error } = await supabaseClient
      .from("messages")
      .select("id, conversation_id, message, created_at")
      .eq("conversation_id", conversationId)
      .order("created_at", { ascending: false })
      .limit(1)
      .maybeSingle();
    if (error && error.code !== "PGRST116") console.warn("Could not load latest message:", error);
    return data || null;
  } catch (e) {
    console.warn("Could not load latest message:", e);
    return null;
  }
}

async function loadConversations(tabName) {
  const user = await getAuthenticatedUser();
  if (!user) return;

  try {
    const filterField = tabName === TABS.buying ? "buyer_id" : "seller_id";
    const { data: rows, error } = await supabaseClient
      .from("conversations")
      .select("id, deal_id, buyer_id, seller_id, created_at")
      .eq(filterField, user.id)
      .order("created_at", { ascending: false });
    if (error) throw error;

    const enriched = [];

    // Pre-fetch unread incoming message rows for all conversations in one batch
    // to avoid doing many small count requests and to ensure badges render
    // immediately without requiring a manual page refresh.
    const convoIds = (rows || []).map(r => r.id).filter(Boolean);
    let unreadMap = {};
    if (convoIds.length) {
      try {
        const { data: unreadRows, error: unreadError } = await supabaseClient
          .from('messages')
          .select('id, conversation_id')
          .in('conversation_id', convoIds)
          .neq('sender_id', user.id)
          .eq('is_read', false);
        if (!unreadError && Array.isArray(unreadRows)) {
          for (const r of unreadRows) {
            unreadMap[r.conversation_id] = (unreadMap[r.conversation_id] || 0) + 1;
          }
        }
      } catch (e) {
        console.warn('Could not batch-load unread rows:', e);
      }
    }

    for (const conversation of rows || []) {
      let adTitle = "Ad";
      let deal = null;
      try {
        const dealResult = await supabaseClient
          .from("deals").select("id, ad_id").eq("id", conversation.deal_id).maybeSingle();
        deal = dealResult.data;
        if (dealResult.error) console.warn("Could not load deal:", dealResult.error);
        if (deal?.ad_id) {
          const adDetails = await getAdDetails(deal.ad_id);
          adTitle = adDetails.title;
        }
      } catch (e) {
        console.warn("Failed to get deal/ad data:", e);
      }

      const latestMessage = await getLatestMessage(conversation.id);
      const otherParticipantName = await getOtherParticipantName(conversation);
      const unreadCount = Number(unreadMap[conversation.id] || 0);
      enriched.push({ ...conversation, adTitle, otherParticipantName, latestMessage, unreadCount });
    }

    const t = (c) => new Date(c.latestMessage?.created_at || c.created_at).getTime();
    enriched.sort((a, b) => t(b) - t(a));

    conversationsCache[tabName] = enriched;
    renderConversationList(enriched);
  } catch (error) {
    console.error("Failed to load chat conversations:", error);
    renderErrorState("We could not load your chats right now.");
  }
}

async function getConversationMessageRows(conversationId) {
  try {
    const { data, error } = await supabaseClient
      .from("messages")
      .select("id, conversation_id, sender_id, message, created_at, delivered_at, is_read")
      .eq("conversation_id", conversationId)
      .order("created_at", { ascending: true });
    if (error) throw error;
    return data || [];
  } catch (e) {
    console.warn("Could not load messages:", e);
    return [];
  }
}

async function renderConversationThread(conversationId) {
  const user = await getAuthenticatedUser();
  if (!user) {
    renderErrorState("You need to sign in to view this conversation.");
    return;
  }

  currentUserId = user.id;
  removeConversationSubscription();

  try {
    const { data: conversation, error } = await supabaseClient
      .from("conversations")
      .select("id, deal_id, buyer_id, seller_id, created_at")
      .eq("id", conversationId)
      .maybeSingle();
    if (error) throw error;

    if (!conversation) { renderErrorState("This conversation could not be found."); return; }
    if (conversation.buyer_id !== user.id && conversation.seller_id !== user.id) {
      renderErrorState("You do not have access to this conversation.");
      return;
    }

    let adTitle = "Ad";
    let adDetails = { title: "Ad", price: "Rs 0", image: null, id: null };
    const { data: deal, error: dealError } = await supabaseClient
      .from("deals").select("id, ad_id").eq("id", conversation.deal_id).maybeSingle();
    if (dealError) console.warn("Could not load deal:", dealError);
    if (deal?.ad_id) {
      adDetails = await getAdDetails(deal.ad_id);
      adTitle = adDetails.title;
    }

    const otherId = conversation.buyer_id === user.id ? conversation.seller_id : conversation.buyer_id;
    const otherProfile = otherId ? await getSellerProfile(otherId) : null;
    const otherName = otherProfile?.username || "User";
    const otherAvatarUrl = otherProfile?.avatar_url || null;
    const messages = await getConversationMessageRows(conversation.id);

    // Batch-mark incoming unread messages as delivered (if null) and read.
    // This updates the DB and then uses the updated rows for rendering so
    // the sender's ticks can update when the conversation is opened later.
    const incomingUnread = (messages || []).filter(m => m && m.sender_id !== user.id && !m.is_read);
    const updatedMap = {};
    if (incomingUnread.length) {
      try {
        const ids = incomingUnread.map(m => m.id);
        const now = new Date().toISOString();

        // Set delivered_at only where it's currently NULL
        await supabaseClient
          .from('messages')
          .update({ delivered_at: now })
          .in('id', ids)
          .is('delivered_at', null);

        // Mark as read and return updated rows to merge into the local list
        const { data: updatedRows, error } = await supabaseClient
          .from('messages')
          .update({ is_read: true })
          .in('id', ids)
          .eq('conversation_id', conversation.id)
          .neq('sender_id', user.id)
          .select('id, conversation_id, sender_id, message, created_at, delivered_at, is_read');

        if (!error && Array.isArray(updatedRows)) {
          updatedRows.forEach(r => { updatedMap[r.id] = r; });
        }
      } catch (e) {
        console.warn('Could not mark messages delivered/read:', e);
      }
    }

    const preparedMessages = (messages || []).map(m => m && updatedMap[m.id] ? updatedMap[m.id] : m);

    currentConversationId = conversation.id;
    isConversationViewOpen = true;
    currentThreadMessages = preparedMessages;

    setHeaderText(otherName, adTitle, true, otherAvatarUrl);
    setAdStrip(true, {
      title: adDetails.title,
      price: adDetails.price,
      image: adDetails.image,
      url: adDetails.id ? `ad-details.html?id=${adDetails.id}` : "#"
    });
    $("chatInputArea").style.display = "flex";

    const messageMarkup = preparedMessages.length
      ? preparedMessages.map(messageHtml).join("")
      : `<div class="conversation-thread-empty">
           <div class="chat-empty-icon">💬</div>
           <div class="chat-empty-title">No messages yet</div>
           <div class="chat-empty-text">Say hello 👋</div>
         </div>`;

    $("chatContainer").innerHTML = `
      <div class="conversation-panel">
        <div class="conversation-thread">${messageMarkup}</div>
      </div>`;

    const thread = document.querySelector(".conversation-thread");
    if (thread) thread.scrollTop = thread.scrollHeight;

    $("messageInput").value = "";
    $("sendButton").disabled = true;

    subscribeToConversationMessages(conversation.id);
    refreshComposerState();
    $("messageInput").focus();
  } catch (error) {
    console.error("Could not open conversation:", error);
    renderErrorState("We could not load this conversation.");
  }
}

async function showTab(tabName) {
  currentTab = Object.values(TABS).includes(tabName) ? tabName : TABS.buying;

  const conversationId = getConversationIdFromUrl();
  if (conversationId) {
    await renderConversationThread(conversationId);
    return;
  }

  const cached = conversationsCache[currentTab];
  if (cached && cached.length) {
    renderConversationList(cached);
    return;
  }

  renderLoadingState();
  await loadConversations(currentTab);
}

async function initializeChat() {
  const chatContainer = $("chatContainer");

  try {
    const user = await getAuthenticatedUser();

    if (!user) {
      currentUserId = null;
      chatContainer.innerHTML = `
        <div class="auth-message">
          <div class="auth-message-title">Sign In Required</div>
          <div class="auth-message-text">You must sign in to access the chat feature.</div>
          <div class="auth-message-buttons">
            <button type="button" class="auth-message-btn secondary" onclick="window.location.href='index.html';">Sign Up</button>
            <button type="button" class="auth-message-btn primary" onclick="window.location.href='index.html';">Sign In</button>
          </div>
        </div>`;
      $("chatInputArea").style.display = "none";
      removeConversationSubscription();
      return;
    }

    currentUserId = user.id;
    resetListState();
    currentTab = TABS.buying;
    await showTab(currentTab);
  } catch (error) {
    console.error("Could not initialize chat:", error);
    chatContainer.innerHTML = `
      <div class="chat-empty">
        <div class="chat-empty-icon">⚠️</div>
        <div class="chat-empty-title">Something went wrong</div>
        <div class="chat-empty-text">Please try refreshing the page.</div>
      </div>`;
  }
}

async function getAuthenticatedUser() {
  try {
    let { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
    if (sessionError) console.warn("getSession error:", sessionError);

    if (!sessionData?.session) {
      const stored = sessionStorage.getItem("sellerAuthSession") || localStorage.getItem("sellerAuthSession");
      if (stored) {
        try {
          const { data, error } = await supabaseClient.auth.setSession(JSON.parse(stored));
          if (error) throw error;
          sessionData = data;
          if (data?.session) sessionStorage.setItem("sellerAuthSession", JSON.stringify(data.session));
        } catch (e) {
          console.warn("Could not restore stored session:", e);
          return null;
        }
      }
    }
    return sessionData?.session?.user || null;
  } catch (e) {
    console.error("Could not get authenticated user:", e);
    return null;
  }
}

/* ---------- Image upload and sending ---------- */

const ALLOWED_IMAGE_TYPES = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp" };
const MAX_IMAGE_BYTES = 5 * 1024 * 1024; // 5 MB
let pendingImageUrl = null;

function formatFileSize(bytes) {
  if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

function setUploadingUi(uploading) {
  $("pendingImagePreview").classList.toggle("is-uploading", uploading);
  $("attachBtn").disabled = uploading;
  if (pendingImage) {
    $("pendingImageMeta").textContent = uploading ? "Sending..." : formatFileSize(pendingImage.size);
  }
}

function showImagePreview(file) {
  // Free the previous preview if the user picked another image
  if (pendingImageUrl) URL.revokeObjectURL(pendingImageUrl);
  pendingImageUrl = URL.createObjectURL(file);

  $("previewImage").src = pendingImageUrl;
  $("pendingImageName").textContent = file.name || "Image";
  $("pendingImageMeta").textContent = formatFileSize(file.size);
  $("pendingImagePreview").style.display = "flex";
}

function clearPendingImage() {
  if (pendingImageUrl) {
    URL.revokeObjectURL(pendingImageUrl);
    pendingImageUrl = null;
  }

  $("previewImage").removeAttribute("src");
  $("pendingImageName").textContent = "";
  $("pendingImageMeta").textContent = "";
  $("pendingImagePreview").style.display = "none";
  $("pendingImagePreview").classList.remove("is-uploading");
  pendingImage = null;

  // Clear file input so the same image can be selected again
  const fileInput = $("imageInput");
  if (fileInput) fileInput.value = "";

  refreshComposerState();
}

function handleImageSelection(file) {
  if (!ALLOWED_IMAGE_TYPES[file.type]) {
    window.alert("Only JPEG, PNG, and WEBP images are allowed.");
    $("imageInput").value = "";
    return;
  }

  if (file.size > MAX_IMAGE_BYTES) {
    window.alert("Image must be smaller than 5 MB.");
    $("imageInput").value = "";
    return;
  }

  pendingImage = file;
  showImagePreview(file);
  refreshComposerState();
}

async function uploadImageToStorage(file, conversationId, userId) {
  const ext = ALLOWED_IMAGE_TYPES[file.type] || "jpg";
  const randomStr = Math.random().toString(36).substring(2, 8);
  const filePath = `${conversationId}/${userId}/${Date.now()}-${randomStr}.${ext}`;

  const { data, error } = await supabaseClient.storage
    .from("chat-images")
    .upload(filePath, file, { upsert: false, contentType: file.type, cacheControl: "3600" });

  if (error) {
    throw new Error(`Upload failed: ${error.message}`);
  }

  const { data: urlData } = supabaseClient.storage
    .from("chat-images")
    .getPublicUrl(data.path);

  return urlData.publicUrl;
}

async function uploadAndSendPendingImage() {
  const file = pendingImage;
  if (!file || !isConversationViewOpen || isUploadingImage || !currentConversationId) return;

  const user = await getAuthenticatedUser();
  if (!user) {
    window.alert("Please sign in again to send a message.");
    return;
  }

  const valid = await validateActiveConversation(currentConversationId, user.id);
  if (!valid) {
    window.alert("You can only send messages in conversations you are part of.");
    return;
  }

  isUploadingImage = true;
  setUploadingUi(true);
  $("sendButton").disabled = true;

  let sent = false;
  try {
    const imageUrl = await uploadImageToStorage(file, currentConversationId, user.id);

    const { data, error } = await supabaseClient
      .from("messages")
      .insert([{ conversation_id: currentConversationId, sender_id: user.id, message: `${CHAT_IMAGE_PREFIX}${imageUrl}` }])
      .select("id, conversation_id, sender_id, message, created_at, delivered_at, is_read")
      .single();

    if (error) throw error;

    if (data) addMessage(data);
    sent = true;
    clearPendingImage();
  } catch (error) {
    console.error("Could not send image:", error);
    window.alert(`Error: ${error.message || "Could not send image. Please try again."}`);
    // Keep the pending image so the user can retry
  } finally {
    isUploadingImage = false;
    setUploadingUi(false);
    refreshComposerState();
    $("messageInput").focus();
  }

  // If the user also typed text, send it as a normal message right after the image
  if (sent && $("messageInput").value.trim()) {
    await sendMessage();
  }
}

/* ---------- Full-size image viewer ---------- */

function openLightbox(src) {
  $("lightboxImg").src = src;
  $("imageLightbox").style.display = "flex";
}

function closeLightbox() {
  $("imageLightbox").style.display = "none";
  $("lightboxImg").removeAttribute("src");
}

/* ---------- Sending ---------- */

async function validateActiveConversation(conversationId, userId) {
  if (!conversationId || !userId) return null;
  try {
    const { data, error } = await supabaseClient
      .from("conversations")
      .select("id, deal_id, buyer_id, seller_id")
      .eq("id", conversationId)
      .maybeSingle();
    if (error) throw error;
    if (!data || (data.buyer_id !== userId && data.seller_id !== userId)) return null;
    return data;
  } catch (e) {
    console.warn("Conversation validation failed:", e);
    return null;
  }
}

async function sendMessage() {
  // Check if there's a pending image to send first
  if (pendingImage) {
    await uploadAndSendPendingImage();
    return;
  }
  
  if (!isConversationViewOpen || isSendingMessage || !currentConversationId) return;

  const user = await getAuthenticatedUser();
  if (!user) { window.alert("Please sign in again to send a message."); return; }

  const text = $("messageInput").value.trim();
  if (!text) { $("sendButton").disabled = true; return; }

  const valid = await validateActiveConversation(currentConversationId, user.id);
  if (!valid) { window.alert("You can only send messages in conversations you are part of."); return; }

  isSendingMessage = true;
  $("sendButton").disabled = true;

  try {
    const { data, error } = await supabaseClient
      .from("messages")
      .insert([{ conversation_id: currentConversationId, sender_id: user.id, message: text }])
      .select("id, conversation_id, sender_id, message, created_at, delivered_at, is_read")
      .single();
    if (error) throw error;

    if (data) addMessage(data);
    $("messageInput").value = "";
  } catch (error) {
    console.error("Could not send message:", error);
    window.alert("Message could not be sent. Please try again.");
  } finally {
    isSendingMessage = false;
    refreshComposerState();
    $("messageInput").focus();
  }
}

/* ---------- Events ---------- */

// Header back arrow: inside a conversation -> chat list; on the list -> dashboard
$("backButton").addEventListener("click", () => {
  if (isConversationViewOpen) {
    goToConversationList();
    return;
  }
  removeConversationSubscription();
  window.location.href = "seller-dashboard.html";
});

// Placeholder ad strip has no link yet, so don't jump to "#"
$("adStrip").addEventListener("click", (e) => {
  if ($("adStrip").getAttribute("href") === "#") e.preventDefault();
});

$("messageInput").addEventListener("input", refreshComposerState);

$("messageInput").addEventListener("keydown", async (e) => {
  if (e.key !== "Enter" || e.shiftKey) return;
  e.preventDefault();
  if ($("sendButton").disabled) return;
  await sendMessage();
});

$("sendButton").addEventListener("click", sendMessage);

// Image attachment handling
$("attachBtn").addEventListener("click", () => {
  $("imageInput").click();
});

$("imageInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (file) {
    handleImageSelection(file);
  }
});

$("clearImageBtn").addEventListener("click", () => {
  clearPendingImage();
});

// Keep the thread pinned to the bottom when an image finishes loading
document.addEventListener("load", (e) => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.classList.contains("chat-image")) return;
  const thread = document.querySelector(".conversation-thread");
  if (!thread) return;
  const distanceFromBottom = thread.scrollHeight - thread.scrollTop - thread.clientHeight;
  if (distanceFromBottom <= img.offsetHeight + 120) thread.scrollTop = thread.scrollHeight;
}, true);

// Broken / expired image: show a neat placeholder instead of the browser's broken icon
document.addEventListener("error", (e) => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.classList.contains("chat-image")) return;
  img.closest(".chat-image-wrap")?.classList.add("is-broken");
}, true);

// Tap an image in the thread to view it full size
document.addEventListener("click", (e) => {
  const img = e.target.closest ? e.target.closest(".chat-image") : null;
  if (img && !img.closest(".is-broken")) openLightbox(img.currentSrc || img.src);
});

$("imageLightbox").addEventListener("click", (e) => {
  if (e.target.id !== "lightboxImg") closeLightbox();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeLightbox();
});

// Run once, whether the DOM is ready yet or not
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initializeChat);
} else {
  initializeChat();
}
</script>
</body>
</html>
