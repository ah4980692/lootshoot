/* ---------- Swipe to reply (drag a bubble to the right) ---------- */

const SWIPE_TRIGGER = 56; // px to drag before a reply is triggered
const SWIPE_MAX = 84;     // visual limit
let swipe = null;
let suppressClickUntil = 0;

function swipeOffset(dx) {
  const d = Math.max(0, dx);
  return d <= SWIPE_TRIGGER ? d : Math.min(SWIPE_MAX, SWIPE_TRIGGER + (d - SWIPE_TRIGGER) * 0.3);
}

function resetSwipeVisual(bubble) {
  const content = bubble.querySelector(".message-content");
  if (content) {
    content.style.transition = "transform .18s ease";
    content.style.transform = "";
  }
  bubble.style.setProperty("--swipe-p", "0");
}

document.addEventListener("pointerdown", (e) => {
  if (!isConversationViewOpen) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  const bubble = e.target.closest ? e.target.closest(".conversation-thread .message-bubble") : null;
  if (!bubble) return;
  swipe = { bubble, id: bubble.dataset.id, startX: e.clientX, startY: e.clientY, active: false, crossed: false, pointerId: e.pointerId };
});

document.addEventListener("pointermove", (e) => {
  if (!swipe || e.pointerId !== swipe.pointerId) return;

  const dx = e.clientX - swipe.startX;
  const dy = e.clientY - swipe.startY;

  if (!swipe.active) {
    // Mostly vertical movement = normal scrolling, so stop tracking
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { swipe = null; return; }
    if (dx > 12 && dx > Math.abs(dy) * 1.2) {
      swipe.active = true;
      document.body.classList.add("is-swiping");
      if (window.getSelection) window.getSelection().removeAllRanges();
    } else {
      return;
    }
  }

  const offset = swipeOffset(dx);
  const content = swipe.bubble.querySelector(".message-content");
  if (content) {
    content.style.transition = "none";
    content.style.transform = `translateX(${offset}px)`;
  }
  swipe.bubble.style.setProperty("--swipe-p", String(Math.min(1, offset / SWIPE_TRIGGER)));

  if (!swipe.crossed && dx >= SWIPE_TRIGGER) {
    swipe.crossed = true;
    if (navigator.vibrate) navigator.vibrate(12);
  } else if (swipe.crossed && dx < SWIPE_TRIGGER) {
    swipe.crossed = false;
  }
});

function endSwipe(e, cancelled) {
  if (!swipe || e.pointerId !== swipe.pointerId) return;
  const s = swipe;
  swipe = null;
  document.body.classList.remove("is-swiping");
  if (!s.active) return;

  suppressClickUntil = Date.now() + 350; // don't treat the end of a swipe as a tap
  resetSwipeVisual(s.bubble);
  if (!cancelled && e.clientX - s.startX >= SWIPE_TRIGGER) startReply(s.id);
}

document.addEventListener("pointerup", (e) => endSwipe(e, false));
document.addEventListener("pointercancel", (e) => endSwipe(e, true));

$("replyBarClose").addEventListener("click", clearReply);

// Keep the thread pinned to the bottom when an image finishes loading
document.addEventListener("load", (e) => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.classList.contains("chat-image")) return;
  const thread = document.querySelector(".conversation-thread");
  if (!thread) return;
  const distanceFromBottom = thread.scrollHeight - thread.scrollTop - thread.clientHeight;
  if (distanceFromBottom <= img.offsetHeight + 120) thread.scrollTop = thread.scrollHeight;
}, true);

// Broken / expired image: show a neat placeholder instead of the browser's broken icon
document.addEventListener("error", (e) => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.classList.contains("chat-image")) return;
  img.closest(".chat-image-wrap")?.classList.add("is-broken");
}, true);

// Tap an image in the thread to view it full size
document.addEventListener("click", (e) => {
  if (Date.now() < suppressClickUntil) return;
  if (!e.target.closest) return;

  // Tap a quoted message to jump to the original
  const quote = e.target.closest(".reply-quote");
  if (quote) {
    jumpToMessage(quote.dataset.replyId);
    return;
  }

  const img = e.target.closest(".chat-image");
  if (img && !img.closest(".is-broken")) openLightbox(img.currentSrc || img.src);
});

$("imageLightbox").addEventListener("click", (e) => {
  if (e.target.id !== "lightboxImg") closeLightbox();
});

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if ($("imageLightbox").style.display === "flex") closeLightbox();
  else if (replyingTo) clearReply();
});

function keepChatBottomVisible() {
  const thread = document.querySelector(".conversation-thread");
  if (!thread) return;
  const view = window.visualViewport;
  const keyboardVisible = !!(view && window.innerHeight - (view.height + (view.offsetTop || 0)) > 80);
  if (!keyboardVisible) return;

  const hasOverflow = thread.scrollHeight > thread.clientHeight + 12;
  if (!hasOverflow) return;

  const distanceFromBottom = thread.scrollHeight - thread.scrollTop - thread.clientHeight;
  if (distanceFromBottom <= 180) {
    requestAnimationFrame(() => {
      thread.scrollTop = thread.scrollHeight;
    });
  }
}

// Keep the layout glued to the visible area whenever the keyboard opens/closes
// or the browser tries to pan the page
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", () => {
    syncViewportHeight();
    if (document.activeElement === $("messageInput")) {
      keepChatBottomVisible();
    }
  });
  window.visualViewport.addEventListener("scroll", syncViewportHeight);
}
window.addEventListener("resize", syncViewportHeight);
window.addEventListener("orientationchange", syncViewportHeight);
window.addEventListener("scroll", () => {
  if (window.scrollX !== 0 || window.scrollY !== 0) window.scrollTo(0, 0);
}, { passive: true });
syncViewportHeight();

/* ---------- Order delivered / received (front end only) ----------
   Wire the real logic through these hooks:
   - setOrderState(role, status)  role: "buyer" | "seller"   status: "pending" | "delivered" | "completed"
       -> call it whenever the deal status changes (load + realtime).
   - onOrderConfirm(action)       action: "delivered" | "received"
       -> runs when the user confirms in the sheet. Save to the backend here,
          then call setOrderState(...) with the new status.
   The UI alone does NOT protect anything; enforce who may do what on the server. */
const ORDER_ICON_CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>';
const ORDER_ICON_INFO = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>';
const ORDER_ICON_PACKAGE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3.3 7.5L12 12.5l8.7-5"/><path d="M12 22V12.5"/><path d="M7.5 5.2l9 5"/></svg>';

let orderRole = null;    // "buyer" | "seller"
let orderStatus = "pending";
let orderToastTimer = null;
let orderPendingAction = null;
let orderRequestInFlight = false;
let currentDealId = null;

function resolveDealOrderStatus(deal) {
  if (!deal) return "pending";
  if (deal.status === "completed" || deal.buyer_confirmed) return "completed";
  if (deal.seller_delivered || deal.status === "delivered") return "delivered";
  return "pending";
}

function orderNoticeHtml(role, buyerName = "Buyer", sellerName = "Seller", productTitle = "Product") {
  const introText = `${esc(buyerName)} has purchased "<b>${esc(productTitle)}</b>" listed by ${esc(sellerName)}. You can communicate, complete, and confirm the deal right here.`;

  const stepsHtml = `
    <div style="margin-top: 10px;">
      <div style="font-weight: 600; margin-bottom: 8px;">How this works</div>
      <div style="font-size: 12px; line-height: 1.6; color: var(--muted);">
        <div style="margin-bottom: 6px;"><span style="font-weight: 600;">1.</span> Seller completes the order and taps <b>Order delivered</b>.</div>
        <div style="margin-bottom: 6px;"><span style="font-weight: 600;">2.</span> Buyer checks the order and taps <b>Order received</b>.</div>
        <div><span style="font-weight: 600;">3.</span> Have a problem? Tap the flag to report it.</div>
      </div>
    </div>
  `;

  return `<div class="order-notice">${ORDER_ICON_INFO}<div>${introText}${stepsHtml}</div></div>`;
}

function showOrderToast(text) {
  const t = $("orderToast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(orderToastTimer);
  orderToastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

function hideOrderActions() {
  orderRole = null;
  $("orderActions").classList.remove("show");
  closeOrderSheet();
}

function setOrderState(role, status) {
  if (role !== "buyer" && role !== "seller") { hideOrderActions(); return; }
  orderRole = role;
  orderStatus = ["pending", "delivered", "completed"].includes(status) ? status : "pending";

  const btn = $("orderBtn");
  let cls = "order-btn", html = "", label = "";
  if (orderStatus === "completed") {
    cls += " done"; html = "Completed"; label = "Order completed";
  } else if (role === "seller") {
    if (orderStatus === "pending") { cls += " ready"; html = "Order delivered"; label = "Mark order as delivered"; }
    else { cls += " waiting"; html = "Waiting"; label = "Waiting for buyer to confirm"; }
  } else {
    if (orderStatus === "pending") { cls += " locked"; html = "Order received"; label = "Order received (available after the seller marks delivered)"; }
    else { cls += " ready"; html = "Order received"; label = "Confirm order received"; }
  }
  btn.className = cls;
  btn.textContent = html;
  btn.setAttribute("aria-label", label);
  btn.setAttribute("aria-disabled", cls.includes("ready") ? "false" : "true");
  btn.disabled = orderRequestInFlight || cls.includes("locked") || cls.includes("waiting") || cls.includes("done");
  $("orderActions").classList.add("show");
}

function openOrderSheet(action) {
  orderPendingAction = action;
  const isDeliver = action === "delivered";
  $("orderSheetIcon").innerHTML = isDeliver ? ORDER_ICON_PACKAGE : ORDER_ICON_CHECK;
  $("orderSheetTitle").textContent = isDeliver ? "Mark order as delivered?" : "Confirm you received it?";
  $("orderSheetText").textContent = isDeliver
    ? "Only continue if everything is completed from your side. The buyer will be asked to confirm that they received it."
    : "Only continue after you've checked everything and it is correct. This can't be undone.";
  $("orderSheetProduct").textContent = currentAdTitle || "Product";
  $("orderSheetPartyLabel").textContent = isDeliver ? "Buyer" : "Seller";
  $("orderSheetParty").textContent = (isDeliver ? currentBuyerName : currentSellerName) || "User";
  $("orderSheetConfirm").textContent = isDeliver ? "Yes, delivered" : "Yes, I received it";
  $("orderSheetCheckRow").style.display = isDeliver ? "none" : "flex";
  $("orderSheetDeliveryCheckRow").style.display = isDeliver ? "flex" : "none";
  $("orderSheetCheckRow").classList.remove("is-checked");
  $("orderSheetDeliveryCheckRow").classList.remove("is-checked");
  $("orderSheetCheck").checked = false;
  $("orderSheetDeliveryCheck").checked = false;
  $("orderSheetConfirm").disabled = true;
  $("orderSheet").classList.add("show");
}

function closeOrderSheet() {
  orderPendingAction = null;
  $("orderSheet").classList.remove("show");
}

async function onOrderConfirm(action) {
  if (orderRequestInFlight) return;
  if (!currentDealId) {
    showOrderToast("Deal information is not available yet.");
    return;
  }

  const rpcName = action === "delivered" ? "seller_mark_order_delivered" : action === "received" ? "buyer_confirm_order_received" : null;
  if (!rpcName) return;

  orderRequestInFlight = true;
  $("orderBtn").disabled = true;

  try {
    const { data, error } = await supabaseClient.rpc(rpcName, { p_deal_id: currentDealId });
    if (error) throw error;

    const updatedDeal = data || null;
    const nextStatus = resolveDealOrderStatus(updatedDeal || {
      status: action === "received" ? "completed" : "active",
      seller_delivered: action === "delivered",
      buyer_confirmed: action === "received"
    });

    if (action === "delivered") {
      setOrderState("seller", nextStatus);
      showOrderToast("Order marked as delivered.");
    } else {
      setOrderState("buyer", nextStatus);
      showOrderToast("Order confirmed as received.");
    }

    if (!currentConversationId || !currentUserId) {
      return;
    }

    const autoMessage = action === "delivered"
      ? `${currentSellerName || "Seller"} has marked the order as delivered.`
      : `${currentBuyerName || "Buyer"} has marked the order as received.`;

    try {
      const { data: insertedMessage, error: insertError } = await supabaseClient
        .from("messages")
        .insert([{
          conversation_id: currentConversationId,
          sender_id: currentUserId,
          message: autoMessage
        }])
        .select("id, conversation_id, sender_id, message, created_at, delivered_at, is_read")
        .single();

      if (insertError) {
        console.warn("Could not add order status message:", insertError);
      } else if (insertedMessage) {
        addMessage(insertedMessage);
      }
    } catch (insertError) {
      console.warn("Could not add order status message:", insertError);
    }

    // Accounts deals only: after the buyer's "received" message, add the Trade Shield notice.
    // Uses the same messages insert + addMessage path (deduplicated by message id) so the
    // seller receives it through the existing messages Realtime subscription.
    const adTypeNormalized = String(currentAdType || "").trim().toLowerCase();
    if (action === "received" && (adTypeNormalized === "accounts" || adTypeNormalized === "account")) {
      try {
        const { data: tradeShieldMessage, error: tradeShieldError } = await supabaseClient
          .from("messages")
          .insert([{
            conversation_id: currentConversationId,
            sender_id: currentUserId,
            message: TRADE_SHIELD_MESSAGE
          }])
          .select("id, conversation_id, sender_id, message, created_at, delivered_at, is_read")
          .single();

        if (tradeShieldError) {
          console.warn("Could not add Trade Shield message:", tradeShieldError);
        } else if (tradeShieldMessage) {
          addMessage(tradeShieldMessage);
        }
      } catch (tradeShieldError) {
        console.warn("Could not add Trade Shield message:", tradeShieldError);
      }
    }
  } catch (error) {
    console.error(`Failed to ${action} order:`, error);
    const message = (error && error.message) ? error.message : "Could not update this order. Please try again.";
    showOrderToast(message);
    if (orderRole === "seller") {
      setOrderState("seller", orderStatus === "delivered" ? "delivered" : "pending");
    } else if (orderRole === "buyer") {
      setOrderState("buyer", orderStatus === "completed" ? "completed" : (orderStatus === "delivered" ? "delivered" : "pending"));
    }
  } finally {
    orderRequestInFlight = false;
    $("orderBtn").disabled = false;
  }
}

$("orderBtn").addEventListener("click", () => {
  if (orderRequestInFlight) return;
  if (orderRole === "seller" && orderStatus === "pending") openOrderSheet("delivered");
  else if (orderRole === "buyer" && orderStatus === "pending") showOrderToast("You can confirm after the seller marks the order as delivered.");
  else if (orderRole === "buyer" && orderStatus === "delivered") openOrderSheet("received");
});
$("orderSheetCheck").addEventListener("change", (e) => {
  $("orderSheetCheckRow").classList.toggle("is-checked", e.target.checked);
  $("orderSheetConfirm").disabled = !e.target.checked;
});
$("orderSheetDeliveryCheck").addEventListener("change", (e) => {
  $("orderSheetDeliveryCheckRow").classList.toggle("is-checked", e.target.checked);
  $("orderSheetConfirm").disabled = !e.target.checked;
});
$("orderSheetCancel").addEventListener("click", closeOrderSheet);
$("orderSheet").addEventListener("click", (e) => { if (e.target === $("orderSheet")) closeOrderSheet(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeOrderSheet(); });
$("orderSheetConfirm").addEventListener("click", () => {
  const action = orderPendingAction;
  closeOrderSheet();
  if (action) onOrderConfirm(action);
});

/* Report: Opens WhatsApp with pre-filled message containing order details */
function openReportOnWhatsApp() {
  const whatsappNumber = "923411444759";
  
  const message = `Hi LootShoot Support, I need help with an issue regarding my order.

Product: ${currentAdTitle}

Buyer: ${currentBuyerName}

Seller: ${currentSellerName}

Conversation ID: ${currentConversationId}`;
  
  const encodedMessage = encodeURIComponent(message);
  const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;
  window.open(whatsappUrl, "_blank");
}
$("reportBtn").addEventListener("click", openReportOnWhatsApp);

  document.addEventListener("DOMContentLoaded", initializeChat);
} else {
  initializeChat();
}
